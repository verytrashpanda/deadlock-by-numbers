<!DOCTYPE html>
<html>
<body>
  <button id="loadHeroes">Load heroes</button>
  <button id="loadHero">Load hero 1</button>
  <button id="loadItems">Load items for hero 1</button>

  <pre id="out"></pre>

  <script>
    const out = document.getElementById("out");

    async function api(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    document.getElementById("loadHeroes").onclick = async () => {
      try {
        const data = await api("https://assets.deadlock-api.com/v2/heroes");
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = e.message;
      }
    };

    document.getElementById("loadHero").onclick = async () => {
      try {
        const data = await api("https://assets.deadlock-api.com/v2/heroes/1");
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = e.message;
      }
    };

    document.getElementById("loadItems").onclick = async () => {
      try {
        const data = await api("https://assets.deadlock-api.com/v2/items/by-hero-id/1?language=english");
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = e.message;
      }
    };
  </script>
</body>
</html>
