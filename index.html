<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlock by Numbers</title>
  <style>
    @font-face {
      font-family: "DeadlockSans";
      src: url("./fonts/retaildemo-regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSans";
      src: url("./fonts/retaildemo-semibold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSans";
      src: url("./fonts/retaildemo-bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockText";
      src: url("./fonts/retailtextdemo-regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockText";
      src: url("./fonts/retailtextdemo-bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSerif";
      src: url("./fonts/reaver-semibold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSerif";
      src: url("./fonts/reaver-bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0b0f13;
      --text: #efe6d5;
      --muted: #a79a88;
      --line: rgba(255, 220, 170, 0.15);
      --hero-ui-r: 95;
      --hero-ui-g: 63;
      --hero-ui-b: 40;
      --boon-accent-r: 84;
      --boon-accent-g: 172;
      --boon-accent-b: 135;
      --weapon-1: #5c3a1f;
      --weapon-2: #2f2218;
      --vitality-1: #344124;
      --vitality-2: #1d2a18;
      --spirit-1: #4f3546;
      --spirit-2: #2a202f;
      --font-sans: "DeadlockSans";
      --font-text: "DeadlockText";
      --font-serif: "DeadlockSerif";
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #26190f 0%, transparent 42%),
        radial-gradient(circle at 90% 90%, #1d1e2d 0%, transparent 44%),
        var(--bg);
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
    }

    .hero-bg-layer {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 480ms ease;
      transform: scale(1.03);
    }

    .hero-bg-layer.active {
      opacity: 1;
    }

    .hero-bg-tint-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 480ms ease;
      z-index: 0;
    }

    .hero-bg-tint-layer.active {
      opacity: 1;
    }

    .hero-bg-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(38, 25, 15, 0.7) 0%, transparent 42%),
        radial-gradient(circle at 90% 90%, rgba(29, 30, 45, 0.65) 0%, transparent 44%),
        linear-gradient(180deg, rgba(8, 10, 12, 0.68), rgba(8, 10, 12, 0.8));
      z-index: 1;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .container {
      width: min(1620px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
    }

    .tab-btn {
      border: 1px solid rgba(255, 220, 170, 0.2);
      background: rgba(30, 20, 14, 0.82);
      color: #e8d8bf;
      padding: 0.42rem 0.9rem;
      font-size: 0.86rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      cursor: pointer;
      border-radius: 0;
    }

    .tab-btn.active {
      border-color: rgba(255, 220, 170, 0.62);
      background: rgba(85, 57, 31, 0.92);
      color: #fff2dd;
    }

    .view[hidden] {
      display: none !important;
    }

    .hero-list {
      background: linear-gradient(160deg, rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.25), rgba(20, 16, 13, 0.86));
      border: 1px solid rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.45);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: sticky;
      top: 0.75rem;
      backdrop-filter: blur(6px);
    }

    .hero-btn {
      border: 1px solid rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.55);
      background: linear-gradient(155deg, rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.22), rgba(45, 31, 22, 0.9));
      color: var(--text);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      transition: 120ms ease;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      --btn-r: var(--hero-ui-r);
      --btn-g: var(--hero-ui-g);
      --btn-b: var(--hero-ui-b);
    }

    .hero-btn-icon {
      width: 1rem;
      height: 1rem;
      object-fit: cover;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      flex: 0 0 auto;
    }

    .hero-btn:hover {
      border-color: rgba(var(--btn-r), var(--btn-g), var(--btn-b), 0.98);
      box-shadow: 0 0 0 1px rgba(var(--btn-r), var(--btn-g), var(--btn-b), 0.45);
      transform: translateY(-1px);
    }

    .hero-btn.active {
      border-color: rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.95);
      background: linear-gradient(135deg, rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.62), rgba(40, 28, 22, 0.95));
      box-shadow: 0 0 0 1px rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.4), 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .hud {
      border: 1px solid rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.52);
      border-radius: 16px;
      background: linear-gradient(165deg, rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.3), rgba(17, 13, 10, 0.96));
      padding: 1rem;
      transition: background 260ms ease, border-color 260ms ease, box-shadow 260ms ease;
      box-shadow: inset 0 1px 0 rgba(var(--hero-ui-r), var(--hero-ui-g), var(--hero-ui-b), 0.28);
    }

    .hud-header {
      display: grid;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 220, 170, 0.15);
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .hud-name {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      letter-spacing: 0.01em;
      text-transform: uppercase;
      font-family: var(--font-serif);
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .boon-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.42rem;
    }

    .boon-item {
      border: 1px solid rgba(var(--boon-accent-r), var(--boon-accent-g), var(--boon-accent-b), 0.55);
      background: linear-gradient(160deg, rgba(var(--boon-accent-r), var(--boon-accent-g), var(--boon-accent-b), 0.2), rgba(15, 11, 9, 0.45));
      border-radius: 6px;
      padding: 0.38rem 0.48rem;
      min-height: 52px;
      display: grid;
      align-content: center;
      gap: 0.14rem;
      box-shadow: inset 0 1px 0 rgba(var(--boon-accent-r), var(--boon-accent-g), var(--boon-accent-b), 0.35);
    }

    .boon-top {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.98rem;
      font-weight: 800;
      color: #fff1dd;
      font-family: var(--font-serif);
      line-height: 1.1;
    }

    .boon-stat-icon {
      width: 1.02rem;
      height: 1.02rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      margin-right: 0.04rem;
    }

    .boon-stat-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.98;
    }

    .boon-stat-mask {
      width: 1.02rem;
      height: 1.02rem;
      display: inline-block;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .boon-stat-mask.heal {
      background-color: #00ff9a;
    }

    .boon-stat-mask.melee {
      background-color: #ff9900;
    }

    .boon-label {
      font-size: 0.78rem;
      color: #ceb999;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-family: var(--font-text);
    }

    .boon-inline-icons {
      display: inline-flex;
      align-items: center;
      gap: 0;
      margin-left: 0.08rem;
    }

    .boon-inline-icon {
      width: 0.9rem;
      height: 0.9rem;
      object-fit: contain;
      transform: scale(1.48);
      transform-origin: center;
      position: relative;
      z-index: 1;
    }

    .boon-inline-icon + .boon-inline-icon {
      margin-left: -0.26rem;
      z-index: 2;
    }

    .controls {
      margin-top: 1rem;
      border-top: 1px solid rgba(255, 220, 170, 0.15);
      padding-top: 0.9rem;
      display: grid;
      gap: 0.4rem;
    }

    .level-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: var(--muted);
    }

    #level-slider {
      width: 100%;
      accent-color: rgb(var(--boon-accent-r), var(--boon-accent-g), var(--boon-accent-b));
      cursor: pointer;
    }

    .boards-grid {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(360px, 1fr));
      gap: 0.6rem;
    }

    .board {
      border: 1px solid rgba(255, 224, 176, 0.2);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255, 229, 181, 0.16);
    }

    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(rgba(255, 255, 255, 0.06) 0.7px, transparent 0.8px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.06), transparent 16%);
      background-size: 4px 4px, 100% 100%;
      opacity: 0.35;
    }

    .board.weapon {
      background: linear-gradient(160deg, #5f3f24, #2f2218);
    }

    .board.vitality {
      background: linear-gradient(160deg, #374627, #1d2a18);
    }

    .board.spirit {
      background: linear-gradient(160deg, #523748, #2a202f);
    }

    .board-header {
      display: grid;
      gap: 0.35rem;
      margin: 0;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid rgba(255, 220, 170, 0.2);
      background: rgba(0, 0, 0, 0.18);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .weapon-header-media {
      position: absolute;
      top: 0.1rem;
      right: 0.45rem;
      width: 60%;
      height: 5.3rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
      z-index: 0;
    }

    .weapon-header-media.visible {
      opacity: 0.96;
    }

    .weapon-image-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: right center;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.46));
      transform: translateX(0.35rem);
      opacity: 0;
      transition: opacity 480ms ease;
    }

    .weapon-image-layer.active {
      opacity: 1;
    }

    .board.weapon .board-title-row,
    .board.weapon .board-tags,
    .board.weapon .board-kicker {
      position: relative;
      z-index: 1;
      padding-right: 6.2rem;
    }

    .board-kicker {
      color: #e0d3bd;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: 0.84rem;
      font-weight: 800;
      line-height: 1;
      font-family: var(--font-serif);
    }

    .board-title-row {
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      align-items: baseline;
      flex-wrap: nowrap;
    }

    .board-title {
      margin: 0;
      font-size: 1.16rem;
      color: #fff5e6;
      line-height: 1.1;
      font-weight: 800;
      font-family: var(--font-sans);
      white-space: nowrap;
    }

    .board-summary {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      color: #f7ddbc;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      font-family: var(--font-serif);
    }

    .board-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.28rem;
    }

    .tag {
      border: 0;
      color: #f2d8b3;
      background: rgba(16, 12, 9, 0.6);
      border-radius: 4px;
      padding: 0.18rem 0.42rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: capitalize;
      font-family: var(--font-text);
    }

    .board-body {
      position: relative;
      z-index: 1;
      padding: 0.58rem;
      display: grid;
      gap: 0.52rem;
    }

    .stat-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.16rem;
    }

    .stat-row {
      border: 1px solid rgba(255, 220, 170, 0.12);
      background: rgba(0, 0, 0, 0.24);
      border-radius: 2px;
      padding: 0.4rem 0.52rem;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 0.28rem;
      overflow: hidden;
    }

    .stat-icon {
      width: 1.55rem;
      text-align: center;
      font-size: 1rem;
      line-height: 1;
      opacity: 0.98;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .stat-icon-img {
      width: 1.5rem;
      height: 1.5rem;
      object-fit: contain;
      opacity: 0.98;
    }

    .stat-icon-mask {
      width: 1.5rem;
      height: 1.5rem;
      display: inline-block;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .stat-icon-mask.weapon {
      background-color: #FF9900;
    }

    .stat-icon-mask.vitality {
      background-color: #00FF9A;
    }

    .stat-icon-mask.spirit {
      background-color: #CE91FF;
    }

    .stat-value {
      font-size: 1.02rem;
      font-weight: 800;
      color: #fff6e8;
      letter-spacing: 0.01em;
      font-family: var(--font-serif);
      flex: 0 0 auto;
      white-space: nowrap;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .stat-scale {
      font-size: 0.88rem;
      font-weight: 800;
      color: #ffcb8b;
      font-family: var(--font-serif);
      white-space: nowrap;
      margin-left: 0.12rem;
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .stat-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #dbccb6;
      margin-left: auto;
      font-family: var(--font-text);
      min-width: 0;
      text-align: right;
      display: inline-flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.22rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .boon-icons {
      margin-left: 0.2rem;
      position: relative;
      width: 1.9rem;
      height: 1.56rem;
      display: inline-block;
      flex: 0 0 auto;
    }

    .boon-icon {
      position: absolute;
      object-fit: contain;
      opacity: 0.98;
    }

    .boon-icon.arrow {
      left: 0;
      top: 0.04rem;
      width: 1.46rem;
      height: 1.46rem;
      z-index: 1;
    }

    .boon-icon.face {
      right: 0;
      top: 0.12rem;
      width: 1.22rem;
      height: 1.22rem;
      z-index: 2;
      border-radius: 999px;
    }

    .boon-icon-fallback {
      width: 0.95rem;
      height: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 800;
      color: #f3e7d6;
      background: rgba(255, 206, 145, 0.34);
      border: 1px solid rgba(255, 218, 166, 0.35);
      line-height: 1;
    }

    .stat-row.zero .stat-value,
    .stat-row.zero .stat-name {
      color: #9f9284;
    }

    .secondary-divider {
      border-top: 1px solid rgba(255, 220, 170, 0.22);
      margin: 0.25rem 0 0.1rem;
      padding-top: 0.5rem;
    }

    .impact-title {
      margin: 0;
      text-transform: uppercase;
      font-weight: 800;
      font-size: 0.82rem;
      color: #e6d7c1;
      letter-spacing: 0.02em;
      font-family: var(--font-serif);
    }

    .spirit-impact-grid {
      display: block;
      margin-top: 0.32rem;
    }

    .spirit-impact-list {
      display: grid;
      gap: 0.22rem;
    }

    .impact-row {
      border: 1px solid rgba(255, 220, 170, 0.12);
      background: rgba(0, 0, 0, 0.24);
      border-radius: 2px;
      padding: 0.44rem 0.52rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      min-height: 36px;
    }

    .impact-label {
      color: #d6c9bc;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: var(--font-text);
      display: inline-flex;
      align-items: center;
      gap: 0.48rem;
    }

    .impact-meta {
      display: inline-grid;
      gap: 0.08rem;
      line-height: 1.08;
    }

    .impact-ability {
      color: #efe2d0;
      font-size: 0.88rem;
      font-weight: 800;
      font-family: var(--font-serif);
    }

    .impact-property {
      color: #cdb8de;
      font-size: 0.74rem;
      font-weight: 700;
      font-family: var(--font-text);
    }

    .impact-value {
      color: #f3e9dc;
      font-size: 1.02rem;
      font-weight: 800;
      min-width: 1.9rem;
      text-align: right;
      font-family: var(--font-serif);
      white-space: nowrap;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .impact-scale-chip {
      display: inline-flex;
      align-items: center;
      min-height: 1.6rem;
      border: 1px solid rgba(203, 144, 255, 0.52);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .impact-scale-on {
      padding: 0.2rem 0.3rem;
      background: rgba(18, 13, 24, 0.9);
      color: #c3adcf;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.2rem;
    }

    .impact-scale-on img {
      width: 0.92rem;
      height: 0.92rem;
      object-fit: contain;
      filter: none;
    }

    .impact-scale-mult {
      padding: 0.2rem 0.44rem;
      background: rgba(34, 24, 43, 0.95);
      color: #f0ddff;
      font-size: 0.88rem;
      font-weight: 800;
      font-family: var(--font-serif);
      white-space: nowrap;
      font-variant-numeric: tabular-nums lining-nums;
    }

    @media (max-width: 640px) {
      .stat-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1220px) {
      .boards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .boards-grid {
        grid-template-columns: 1fr;
      }
    }

    .impact-icon {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 999px;
      background: #b9b5bc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .impact-icon img {
      width: 0.9rem;
      height: 0.9rem;
      object-fit: contain;
      filter: grayscale(1) brightness(0.28) contrast(1.1);
    }

    .scaling-panel {
      border: 1px solid rgba(255, 220, 170, 0.12);
      background: linear-gradient(165deg, rgba(28, 21, 16, 0.94), rgba(17, 13, 10, 0.96));
      padding: 0.9rem;
    }

    const STAT_LABELS = {

    const STAT_ICON_KEYS = {

    };

    const COLOR_ICON_OVERRIDES = {
      damage_bullet: "damage_bullet_color",
      icon_damage_bullet: "damage_bullet_color",
      damage_melee: "damage_melee_color",
      damage_crit: "damage_crit_color",

      health_stealing_bullets: "health_stealing_bullets_color",
      health_stealing_melee: "health_stealing_melee_color",
      health_stealing_spirit: "health_stealing_spirit_color"
    };

    function asNumber(value) {
      return typeof value === "number" ? value : Number(value);
    }

    function fullPrecision(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      const numeric = typeof value === "number" ? value : Number(value);
      if (!Number.isFinite(numeric)) return "-";
      const normalized = Math.abs(numeric) < 1e-12 ? 0 : numeric;
      const rendered = normalized.toLocaleString("en-US", {
        useGrouping: false,
        maximumFractionDigits: 3
      });
      return rendered.includes(".") ? rendered.replace(/\.?0+$/, "") : rendered;
    }

    function toTitle(value) {
      return String(value || "")
        .replace(/[_-]+/g, " ")
        .trim()
        .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function possessive(name) {
      const safe = String(name || "").trim();
      if (!safe) return "";
      return /s$/i.test(safe) ? `${safe}'` : `${safe}'s`;
    }

    const WEAPON_NAME_OVERRIDES = {
      citadel_weapon_bull_set: "Abrams' Shotgun"
    };

    function getReadableWeaponName(hero, weapon) {
      const rawName = String(weapon?.name || "").trim();
      const className = String(weapon?.class_name || "").trim();
      if (WEAPON_NAME_OVERRIDES[className]) return WEAPON_NAME_OVERRIDES[className];
      const looksInternal = !rawName || rawName === className || /^citadel_/i.test(rawName);
      if (!looksInternal) return rawName;

      const gunTag = String(hero?.gun_tag || "").trim();
      if (gunTag) return `${possessive(hero?.name)} ${toTitle(gunTag)}`;

      const cleaned = className
        .replace(/^citadel_weapon_/i, "")
        .replace(/_set$/i, "")
        .replace(/^hero_/i, "");
      return toTitle(cleaned || "Primary Weapon");
    }

    function getWeaponDisplayImage(hero, weapon) {
      return (
        hero?.shop_stat_display?.weapon_stats_display?.weapon_image_webp ||
        hero?.shop_stat_display?.weapon_stats_display?.weapon_image ||
        weapon?.image_webp ||
        weapon?.image ||
        ""
      );
    }

    function toMeters(sourceUnits) {
      return sourceUnits / 39.37;
    }

    function formatValue(value, statType) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      const multiplierPercentStats = new Set([
        "EReloadSpeed",
        "ETechRange",
        "ETechDuration",
        "EHealingOutput",
        "ECritDamageReceivedScale"
      ]);
      const asPercentFromMultiplier = (raw) => (raw - 1) * 100;
      const displayNumber = multiplierPercentStats.has(statType) ? asPercentFromMultiplier(value) : value;

      if (multiplierPercentStats.has(statType)) {
        return `${fullPrecision(displayNumber)}%`;
      }
      if (statType === "EBulletSpeed") return `${fullPrecision(displayNumber)}m/s`;
      if (["EMaxMoveSpeed", "ESprintSpeed", "EDashSpeedInMeters"].includes(statType)) return `${fullPrecision(displayNumber)}m`;
      if (statType.includes("Time") || statType.includes("Cooldown")) return `${fullPrecision(displayNumber)}s`;
      if (
        statType.includes("Resist") ||
        statType.includes("BonusScale") ||
        statType.includes("Increase") ||
        statType.includes("Reduction") ||
        statType.includes("Lifesteal") ||
        statType === "ECritDamageReceivedScale"
      ) {
        return `${fullPrecision(displayNumber)}%`;
      }
      if (statType === "ERoundsPerSecond" || statType === "EFireRate") return fullPrecision(displayNumber);
      if (statType === "EWeaponDPS" || statType === "EClipSize" || statType.includes("Damage")) return fullPrecision(displayNumber);
      return fullPrecision(displayNumber);
    }

    function isDisplayZero(value, statType) {
      if (value === null || value === undefined || Number.isNaN(value)) return false;
      const multiplierPercentStats = new Set([
        "EReloadSpeed",
        "ETechRange",
        "ETechDuration",
        "EHealingOutput",
        "ECritDamageReceivedScale"
      ]);
      const displayNumber = multiplierPercentStats.has(statType) ? (value - 1) * 100 : value;
      return fullPrecision(displayNumber) === "0";
    }

    function resolveIconKey(iconKey) {
      if (!iconKey) return "";
      const raw = String(iconKey).trim();
      if (!raw) return "";
      const baseKey = raw.replace(/_unfilled$/i, "");
      if (COLOR_ICON_OVERRIDES[baseKey] && iconsIndex[COLOR_ICON_OVERRIDES[baseKey]]) {
        return COLOR_ICON_OVERRIDES[baseKey];
      }
      if (iconsIndex[baseKey]) return baseKey;
      if (iconsIndex[raw]) return raw;
      return "";
    }

    function iconUrlFromKey(iconKey) {
      const resolved = resolveIconKey(iconKey);
      return resolved ? iconsIndex[resolved] : "";
    }

    function iconUrlForStat(statType) {
      const keys = STAT_ICON_KEYS[statType] || [];
      for (const key of keys) {
        const url = iconUrlFromKey(key);
        if (url) return url;
      }
      return iconUrlFromKey("damage_bullet_color") || "";
    }

    function iconDataForStat(statType) {
      const keys = STAT_ICON_KEYS[statType] || [];
      for (const key of keys) {
        const resolved = resolveIconKey(key);
        if (resolved) return { url: iconsIndex[resolved], key: resolved };
      }
      const fallback = resolveIconKey("damage_bullet_color");
      return fallback ? { url: iconsIndex[fallback], key: fallback } : { url: "", key: "" };
    }

    function iconNeedsTint(resolvedKey) {
      return !resolvedKey.includes("_color") && !resolvedKey.startsWith("citadel_build_tag_");
    }

    function getHeroFaceIconUrl(hero) {
      return (
        hero?.images?.icon_image_small_webp ||
        hero?.images?.icon_image_small ||
        hero?.icon_image_small ||
        ""
      );
    }

    function parseAbilityBaseValue(property) {
      const raw = property?.value;
      if (raw === null || raw === undefined) return { value: 0, unit: "" };
      if (typeof raw === "number" && Number.isFinite(raw)) {
        return { value: raw, unit: property?.postfix || "" };
      }
      const text = String(raw).trim();
      const match = text.match(/-?\d+(?:\.\d+)?/);
      if (!match) return { value: 0, unit: property?.postfix || "" };
      const numeric = Number(match[0]);
      const trailing = text.replace(match[0], "").trim();
      const unit = property?.postfix !== undefined && property?.postfix !== null
        ? String(property.postfix)
        : trailing;
      return { value: Number.isFinite(numeric) ? numeric : 0, unit };
    }

    function formatScaledAbilityValue(value, unit) {
      const suffix = unit === null || unit === undefined ? "" : String(unit);
      return `${fullPrecision(value)}${suffix}`;
    }

    function prettifyAbilityKey(value) {
      return String(value || "")
        .replace(/[_-]+/g, " ")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .trim()
        .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function getAbilityIcon(ability) {
      return (
        ability?.image_webp ||
        ability?.image ||
        ability?.icon_webp ||
        ability?.icon ||
        ""
      );
    }

    function getAbilityScaleFunctions(property) {
      const out = [];
      if (property?.scale_function) {
        if (Array.isArray(property.scale_function)) out.push(...property.scale_function);
        else out.push(property.scale_function);
      }
      if (Array.isArray(property?.scale_functions)) out.push(...property.scale_functions);
      return out.filter(Boolean);
    }

    function getAbilityPropertyUnit(property, parsedBase) {
      if (property?.postfix !== undefined && property?.postfix !== null) return String(property.postfix);
      if (parsedBase?.unit) return parsedBase.unit;
      if (property?.display_units !== undefined && property?.display_units !== null) return String(property.display_units);
      return "";
    }

    function getScaleTypeLabel(scaleFn) {
      const type = String(scaleFn?.specific_stat_scale_type || "").trim();
      if (type && STAT_LABELS[type]) return STAT_LABELS[type];
      if (type) return prettifyAbilityKey(type);
      const scalingStats = Array.isArray(scaleFn?.scaling_stats) ? scaleFn.scaling_stats : [];
      if (scalingStats.length) {
        return scalingStats.map((entry) => STAT_LABELS[entry] || prettifyAbilityKey(entry)).join(", ");
      }
      return "Scaling";
    }

    function resolveAbilityPropertyValue(property, spiritPower, tierBonus = 0) {
      const parsedBase = parseAbilityBaseValue(property);
      const scaleFns = getAbilityScaleFunctions(property);
      let total = parsedBase.value;
      let hasSpiritScaling = false;
      let hasOtherScaling = false;

      for (const scaleFn of scaleFns) {
        const statScale = asNumber(scaleFn?.stat_scale);
        if (!Number.isFinite(statScale) || statScale === 0) continue;
        if (isSpiritScalingFunction(scaleFn)) {
          total += spiritPower * statScale;
          hasSpiritScaling = true;
        } else {
          hasOtherScaling = true;
        }
      }

      total += tierBonus;

      return {
        total,
        unit: getAbilityPropertyUnit(property, parsedBase),
        hasSpiritScaling,
        hasOtherScaling,
        scaleFns
      };
    }

    function normaliseItemRef(value) {
      if (!value) return "";
      if (typeof value === "string" || typeof value === "number") return String(value);
      if (typeof value !== "object") return "";
      return String(
        value.class_name ??
        value.className ??
        value.item_class_name ??
        value.itemClassName ??
        value.item_id ??
        value.itemId ??
        value.id ??
        value.value ??
        ""
      );
    }

    function inferTierFromRef(ref, fallbackTier = 0) {
      const text = String(ref || "");
      const m = text.match(/(?:_|)tier[_-]?(\d)|(?:_|)t(\d)|(?:_|)upg(?:rade)?[_-]?(\d)|(?:_|)(\d)$/i);
      const raw = m ? (m[1] || m[2] || m[3] || m[4]) : "";
      const tier = Number(raw);
      return Number.isFinite(tier) && tier >= 1 && tier <= 3 ? tier : fallbackTier;
    }

    function extractUpgradeRefs(ability) {
      if (!ability || typeof ability !== "object") return [];
      const refs = [];
      const seen = new Set();

      const pushRef = (value, tierHint = 0) => {
        const ref = normaliseItemRef(value);
        if (!ref || ref === String(ability.id) || ref === String(ability.class_name || "")) return;
        const key = `${ref}|${tierHint}`;
        if (seen.has(key)) return;
        seen.add(key);
        refs.push({ ref, tierHint: tierHint || inferTierFromRef(ref, 0) });
      };

      const pushCandidate = (candidate, tierHint = 0) => {
        if (!candidate) return;
        if (Array.isArray(candidate)) {
          candidate.forEach((entry) => pushCandidate(entry, tierHint));
          return;
        }
        if (typeof candidate === "string" || typeof candidate === "number") {
          pushRef(candidate, tierHint);
          return;
        }
        if (typeof candidate === "object") {
          const directRef = normaliseItemRef(candidate);
          if (directRef) pushRef(directRef, candidate.item_tier || candidate.itemTier || tierHint || 0);
          [candidate.ref, candidate.item, candidate.upgrade, candidate.value].forEach((entry) => pushCandidate(entry, tierHint));
        }
      };

      [
        [ability.upgrades, 0],
        [ability.ability_upgrades, 0],
        [ability.abilityUpgrades, 0],
        [ability.tier_upgrades, 0],
        [ability.tierUpgrades, 0],
        [ability.children, 0],
        [ability.child_items, 0],
        [ability.childItems, 0],
        [ability.t1, 1],
        [ability.t2, 2],
        [ability.t3, 3],
        [ability.tier1, 1],
        [ability.tier2, 2],
        [ability.tier3, 3]
      ].forEach(([candidate, tierHint]) => pushCandidate(candidate, tierHint));

      return refs;
    }

    function mergeAbilityProperty(baseProperty, overrideProperty) {
      if (!baseProperty) return { ...overrideProperty };
      if (!overrideProperty) return { ...baseProperty };
      return {
        ...baseProperty,
        ...overrideProperty,
        scale_function: overrideProperty.scale_function ?? baseProperty.scale_function,
        scale_functions: overrideProperty.scale_functions ?? baseProperty.scale_functions,
        value: overrideProperty.value ?? baseProperty.value,
        postfix: overrideProperty.postfix ?? baseProperty.postfix,
        label: overrideProperty.label ?? baseProperty.label,
        postvalue_label: overrideProperty.postvalue_label ?? baseProperty.postvalue_label,
        display_units: overrideProperty.display_units ?? baseProperty.display_units
      };
    }

    function buildAbilityForTier(bundle, tier) {
      const base = bundle?.base || null;
      if (!base) return null;
      const merged = {
        ...base,
        properties: { ...(base.properties || {}) }
      };

      const upgrades = Array.isArray(bundle?.upgrades) ? bundle.upgrades : [];
      upgrades
        .filter((upgrade) => Number(upgrade?.tier || 0) >= 1 && Number(upgrade?.tier || 0) <= tier)
        .sort((a, b) => a.tier - b.tier)
        .forEach((upgrade) => {
          Object.entries(upgrade.item?.properties || {}).forEach(([key, property]) => {
            merged.properties[key] = mergeAbilityProperty(merged.properties[key], property);
          });
        });

      return merged;
    }

    function getSpiritPowerAtDisplayLevel() {
      if (!currentModel) return 0;
      const displayLevel = Number(levelSliderEl.value);
      const level = displayLevel + 1;
      const spiritRows = buildCategoryRows(currentModel.spiritStatIds, currentModel.hero, currentModel.weapon, level);
      const spiritPowerRow = spiritRows.find((row) => row.statType === "ETechPower");
      return spiritPowerRow?.current ?? 0;
    }

    function normaliseAbilityProperties(ability) {
      return Object.entries(ability?.properties || {}).map(([key, property]) => ({
        key,
        property,
        label: property?.label || property?.postvalue_label || prettifyAbilityKey(key)
      }));
    }

    function renderAbilities() {
      if (!abilitiesGridEl) return;
      const abilityBundles = currentModel?.abilityBundles || [];
      const spiritPower = getSpiritPowerAtDisplayLevel();

      if (!abilityBundles.length) {
        abilitiesGridEl.innerHTML = `<article class="ability-card"><div class="ability-card-body"><div class="ability-empty">No ability data found.</div></div></article>`;
        return;
      }

      abilitiesGridEl.innerHTML = "";

      abilityBundles.forEach((bundle, index) => {
        const tierState = Number(currentModel.abilityTiers?.[index] || 0);
        const ability = buildAbilityForTier(bundle, tierState) || bundle?.base;
        if (!ability) return;

        const card = document.createElement("article");
        card.className = "board spirit ability-card";

        const properties = normaliseAbilityProperties(ability);
        const icon = getAbilityIcon(ability);
        const subtitle = ability?.ability_type ? prettifyAbilityKey(ability.ability_type) : "Signature Ability";

        const visibleRows = properties
          .map(({ key, property, label }) => {
            const resolved = resolveAbilityPropertyValue(property, spiritPower, 0);
            const visibleValue = fullPrecision(resolved.total);
            const isZeroValue = visibleValue === "0" || visibleValue === "-0";
            if (isZeroValue && !resolved.hasSpiritScaling && !resolved.hasOtherScaling) {
              return "";
            }

            const badges = [];
            if (resolved.hasSpiritScaling) badges.push(`<span class="ability-scale-badge spirit">Spirit</span>`);
            if (resolved.hasOtherScaling) badges.push(`<span class="ability-scale-badge">Other Scaling</span>`);
            if (tierState) badges.push(`<span class="ability-scale-badge">T${tierState}</span>`);

            const scaleMeta = resolved.scaleFns
              .map((scaleFn) => {
                const statScale = asNumber(scaleFn?.stat_scale);
                if (!Number.isFinite(statScale) || statScale === 0) return "";
                return `${getScaleTypeLabel(scaleFn)} × ${fullPrecision(statScale)}`;
              })
              .filter(Boolean)
              .join(" • ");

            return `
                <div class="ability-stat-row">
                  <div class="ability-stat-top">
                    <span class="ability-stat-name">${label}</span>
                    <span class="ability-stat-value">${formatScaledAbilityValue(resolved.total, resolved.unit)}</span>
                  </div>
                  <div class="ability-stat-meta">
                    <span class="ability-scale-badges">
                      ${badges.join("")}
                    </span>
                    <span class="ability-stat-source">${scaleMeta || "Base Value"}</span>
                  </div>
                </div>
              `;
          })
          .filter(Boolean);

        const rowsHtml = visibleRows.length
          ? visibleRows.join("")
          : `<div class="ability-empty ability-section-full">No non-zero properties exposed for this ability.</div>`;

        card.innerHTML = `
          <header class="board-header">
            <div class="board-kicker">Ability ${index + 1}</div>
            <div class="ability-title-row">
              ${icon ? `<img class="ability-icon" src="${icon}" alt="" loading="lazy" />` : `<div class="ability-icon"></div>`}
              <div class="ability-title-block">
                <h3 class="board-title">${ability?.name || prettifyAbilityKey(ability?.class_name || `Ability ${index + 1}`)}</h3>
                <div class="ability-subtitle">${subtitle}</div>
              </div>
            </div>
            <div class="ability-tier-controls" data-ability-index="${index}">
              ${[0, 1, 2, 3].map((tier) => `
                <button class="ability-tier-btn ${tierState === tier ? "active" : ""}" type="button" data-tier="${tier}">
                  T${tier}
                </button>
              `).join("")}
            </div>
          </header>
          <div class="board-body ability-card-body">
            ${rowsHtml}
          </div>
        `;

        abilitiesGridEl.appendChild(card);
      });

      abilitiesGridEl.querySelectorAll(".ability-tier-controls").forEach((wrap) => {
        wrap.addEventListener("click", (event) => {
          const btn = event.target.closest(".ability-tier-btn");
          if (!btn) return;
          const abilityIndex = Number(wrap.dataset.abilityIndex);
          const tier = Number(btn.dataset.tier);
          if (!currentModel.abilityTiers) currentModel.abilityTiers = [0, 0, 0, 0];
          currentModel.abilityTiers[abilityIndex] = tier;
          renderAbilities();
        });
      });
    }

    function isSpiritScalingFunction(scaleFn) {
      const type = String(scaleFn?.specific_stat_scale_type || "");
      if (type === "ETechPower") return true;
      const scalingStats = Array.isArray(scaleFn?.scaling_stats) ? scaleFn.scaling_stats : [];
      if (scalingStats.includes("ETechPower")) return true;
      const className = String(scaleFn?.class_name || "").toLowerCase();
      const subclassName = String(scaleFn?.subclass_name || "").toLowerCase();
      // Some spirit-damage scalers are tagged as EStatsCount in API metadata.
      if (className.includes("tech_damage") || subclassName.includes("tech_damage")) return true;
      return false;
    }

    async function loadIconsIndex() {
      try {
        const res = await fetch(ICONS_API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        iconsIndex = await res.json();
      } catch (error) {
        iconsIndex = {};
      }
    }

    function getScalePerLevel(statType, hero, baseValue) {
      const scale = hero.standard_level_up_upgrades || {};
      if (statType === "EMaxHealth") return asNumber(scale.MODIFIER_VALUE_BASE_HEALTH_FROM_LEVEL) || 0;
      if (statType === "EBulletArmorDamageReduction") return asNumber(scale.MODIFIER_VALUE_BULLET_ARMOR_DAMAGE_RESIST) || 0;
      if (statType === "ETechArmorDamageReduction") return asNumber(scale.MODIFIER_VALUE_TECH_ARMOR_DAMAGE_RESIST) || 0;
      if (statType === "ETechPower") return asNumber(scale.MODIFIER_VALUE_TECH_POWER) || 0;
      if (statType === "EBulletDamage") return asNumber(scale.MODIFIER_VALUE_BASE_BULLET_DAMAGE_FROM_LEVEL) || 0;
      if (statType === "ELightMeleeDamage") return asNumber(scale.MODIFIER_VALUE_BASE_MELEE_DAMAGE_FROM_LEVEL) || 0;
      if (statType === "EHeavyMeleeDamage") {
        const lightBase = asNumber(baseValue.lightBase) || 0;
        const heavyBase = asNumber(baseValue.heavyBase) || 0;
        const lightScale = asNumber(scale.MODIFIER_VALUE_BASE_MELEE_DAMAGE_FROM_LEVEL) || 0;
        return lightBase > 0 ? (heavyBase / lightBase) * lightScale : 0;
      }
      return 0;
    }

    function getBaseStatValue(statType, hero, weapon) {
      const s = hero.starting_stats || {};
      const w = weapon.weapon_info || {};
      const fromStarting = (key) => asNumber(s[key]?.value);

      switch (statType) {
        case "EMaxHealth":
          return fromStarting("max_health");
        case "EBaseHealthRegen":
          return fromStarting("base_health_regen");
        case "EHealingOutput":
          return 1;
        case "EBulletArmorDamageReduction":
        case "ETechArmorDamageReduction":
        case "EOOCHealthRegen":
        case "EMeleeResist":
        case "EDebuffResist":
        case "ETechLifesteal":
        case "EMaxChargesIncrease":
        case "ETechCooldownBetweenChargeUses":
        case "EBaseWeaponDamageIncrease":
        case "EBulletSpeedIncrease":
        case "EBulletLifesteal":
        case "ECritDamageBonusScale":
        case "EClipSizeIncrease":
        case "EStaminaRegenIncrease":
          return 0;
        case "EMaxMoveSpeed":
          return fromStarting("max_move_speed");
        case "ESprintSpeed":
          return fromStarting("sprint_speed");
        case "EStamina":
          return fromStarting("stamina");
        case "EDashSpeedInMeters":
          return 14.3;
        case "EBulletDamage":
          return asNumber(w.bullet_damage);
        case "ERoundsPerSecond":
          return asNumber(w.shots_per_second);
        case "EFireRate":
          return 0;
        case "EClipSize":
          return asNumber(w.clip_size);
        case "EReloadTime":
          return asNumber(w.reload_duration);
        case "EReloadSpeed":
          return fromStarting("reload_speed");
        case "EStaminaCooldown": {
          const staminaRegen = fromStarting("stamina_regen_per_second");
          if (staminaRegen && staminaRegen > 0) return 1 / staminaRegen;
          return null;
        }
        case "EBulletSpeed":
          return w.bullet_speed ? toMeters(asNumber(w.bullet_speed)) : null;
        case "EWeaponDPS":
          return asNumber(w.damage_per_second);
        case "ELightMeleeDamage":
          return fromStarting("light_melee_damage");
        case "EHeavyMeleeDamage":
          return fromStarting("heavy_melee_damage");
        case "ETechPower":
          return fromStarting("tech_power") || 0;
        case "ETechRange":
          return fromStarting("tech_range");
        case "ETechDuration":
          return fromStarting("tech_duration");
        case "ETechCooldown":
          return 0;
        case "ECritDamageReceivedScale":
          return 1;
        default:
          return null;
      }
    }

    function buildCategoryRows(statIds, hero, weapon, level) {
      return statIds.map((statType) => {
        const lightBase = getBaseStatValue("ELightMeleeDamage", hero, weapon);
        const heavyBase = getBaseStatValue("EHeavyMeleeDamage", hero, weapon);
        const base = getBaseStatValue(statType, hero, weapon);
        const perLevel = getScalePerLevel(statType, hero, { lightBase, heavyBase });
        const current = base === null ? null : base + perLevel * (level - 1);
        return {
          statType,
          label: STAT_LABELS[statType] || statType,
          base,
          current,
          perLevel
        };
      });
    }

    function renderStatGrid(container, rows, category) {
      container.innerHTML = "";
      const heroFaceIcon = getHeroFaceIconUrl(currentModel?.hero);
      const boonArrowIcon = iconUrlFromKey("keystat_boon_arrow");
      rows.forEach((row) => {
        const statRow = document.createElement("article");
        const isZero = isDisplayZero(row.current, row.statType);
        const hasBoonScaling = row.perLevel !== 0;
        const scaleText = hasBoonScaling ? `+${fullPrecision(row.perLevel)}` : "";
        const boonIconsHtml = hasBoonScaling
          ? `<span class="boon-icons">${boonArrowIcon ? `<img class="boon-icon arrow" src="${boonArrowIcon}" alt="" loading="lazy" />` : `<span class="boon-icon-fallback">^</span>`}${heroFaceIcon ? `<img class="boon-icon face" src="${heroFaceIcon}" alt="" loading="lazy" />` : `<span class="boon-icon-fallback">H</span>`}</span>`
          : "";
        const { url: iconUrl, key: iconKey } = iconDataForStat(row.statType);
        const useMaskTint = iconUrl && iconNeedsTint(iconKey);
        const iconHtml = useMaskTint
          ? `<span class="stat-icon-mask ${category}" style="-webkit-mask-image:url('${iconUrl}');mask-image:url('${iconUrl}');"></span>`
          : (iconUrl ? `<img class="stat-icon-img" src="${iconUrl}" alt="" loading="lazy" />` : "");
        statRow.className = `stat-row ${isZero ? "zero" : ""}`;
        statRow.innerHTML = `
          <span class="stat-icon">${iconHtml}</span>
          <span class="stat-value">${formatValue(row.current, row.statType)}</span>
          ${hasBoonScaling ? `<span class="stat-scale">${scaleText}</span>` : ""}
          <span class="stat-name">${row.label}${boonIconsHtml}</span>
        `;
        container.appendChild(statRow);
      });
    }

    function splitWeaponRows(rows) {
      const melee = new Set(["ELightMeleeDamage", "EHeavyMeleeDamage"]);
      return {
        primary: rows.filter((r) => !melee.has(r.statType)),
        secondary: rows.filter((r) => melee.has(r.statType))
      };
    }

    function splitVitalityRows(rows) {
      const mobility = new Set([
        "EMaxMoveSpeed",
        "ESprintSpeed",
        "EStaminaCooldown",
        "EStaminaRegenIncrease",
        "EStamina",
        "EDashSpeedInMeters"
      ]);
      return {
        primary: rows.filter((r) => !mobility.has(r.statType)),
        secondary: rows.filter((r) => mobility.has(r.statType))
      };
    }

    function renderSpiritImpact(rows) {
      const spiritPowerRow = rows.find((row) => row.statType === "ETechPower");
      const displayLevel = Number(levelSliderEl.value);
      const directBase = getBaseStatValue("ETechPower", currentModel?.hero || {}, currentModel?.weapon || {}) || 0;
      const directPerLevel = getScalePerLevel("ETechPower", currentModel?.hero || {}, {});
      const spiritPower = spiritPowerRow?.current ?? (directBase + directPerLevel * displayLevel);
      const spiritScaleIcon = iconUrlFromKey("citadel_build_tag_spirit") || iconUrlFromKey("spirit");

      const impactRows = (currentModel?.spiritScaleEntries || [])
        .map((entry) => ({
          ability: entry.ability,
          property: entry.property,
          scale: entry.scale,
          iconUrl: entry.iconUrl || "",
          total: (asNumber(entry.base) || 0) + spiritPower * entry.scale,
          unit: entry.unit || "",
          absScale: Math.abs(entry.scale)
        }))
        .sort((a, b) => b.absScale - a.absScale);

      if (!impactRows.length) {
        spiritImpactListEl.innerHTML = `<div class="impact-row"><span class="impact-label">No hero-specific spirit scaling entries found.</span><span class="impact-value">-</span></div>`;
      } else {
        spiritImpactListEl.innerHTML = impactRows
          .slice(0, 8)
          .map((row) => `<div class="impact-row"><span class="impact-label">${row.iconUrl ? `<span class="impact-icon"><img src="${row.iconUrl}" alt="" loading="lazy" /></span>` : ""}<span class="impact-meta"><span class="impact-ability">${row.ability}</span><span class="impact-property">${row.property}</span></span></span><span class="impact-value">${formatScaledAbilityValue(row.total, row.unit)}</span><span class="impact-scale-chip"><span class="impact-scale-on">${spiritScaleIcon ? `<img src="${spiritScaleIcon}" alt="" loading="lazy" />` : ""}</span><span class="impact-scale-mult">x ${fullPrecision(row.scale)}</span></span></div>`)
          .join("");
      }
      spiritImpactWrapEl.style.display = "";
    }

    function renderBoonStrip(hero) {
      const scale = hero?.standard_level_up_upgrades || {};
      const heroFace = getHeroFaceIconUrl(hero);
      const boonArrowIcon = iconUrlFromKey("keystat_boon_arrow");
      const iconHtml = (boonArrowIcon || heroFace)
        ? `<span class="boon-icons">${boonArrowIcon ? `<img class="boon-icon arrow" src="${boonArrowIcon}" alt="" loading="lazy" />` : `<span class="boon-icon-fallback">^</span>`}${heroFace ? `<img class="boon-icon face" src="${heroFace}" alt="" loading="lazy" />` : `<span class="boon-icon-fallback">H</span>`}</span>`
        : "";

      const boons = [
        { value: asNumber(scale.MODIFIER_VALUE_BASE_HEALTH_FROM_LEVEL) || 0, label: "Health / Boon", statType: "EMaxHealth", iconKey: "heal", tone: "heal" },
        { value: asNumber(scale.MODIFIER_VALUE_BASE_BULLET_DAMAGE_FROM_LEVEL) || 0, label: "Bullet Damage / Boon", statType: "EBulletDamage" },
        { value: asNumber(scale.MODIFIER_VALUE_BASE_MELEE_DAMAGE_FROM_LEVEL) || 0, label: "Melee Damage / Boon", statType: "ELightMeleeDamage", iconKey: "melee_light", tone: "melee" },
        { value: asNumber(scale.MODIFIER_VALUE_TECH_POWER) || 0, label: "Spirit Power / Boon", statType: "ETechPower" },
        { value: asNumber(scale.MODIFIER_VALUE_BULLET_ARMOR_DAMAGE_RESIST) || 0, label: "Bullet Resist / Boon", statType: "EBulletArmorDamageReduction" },
        { value: asNumber(scale.MODIFIER_VALUE_TECH_ARMOR_DAMAGE_RESIST) || 0, label: "Spirit Resist / Boon", statType: "ETechArmorDamageReduction" }
      ].filter((entry) => entry.value !== 0);

      if (!boons.length) {
        boonStripEl.innerHTML = "";
        return;
      }

      boonStripEl.innerHTML = boons
        .map((entry) => {
          const valueText = `+${fullPrecision(entry.value)}`;
          const iconKey = entry.iconKey || (STAT_ICON_KEYS[entry.statType]?.[0] || "");
          const statIcon = iconUrlFromKey(iconKey) || iconUrlForStat(entry.statType);
          const lowerKey = String(iconKey || "").toLowerCase();
          const explicitTone = entry.tone || (lowerKey.includes("heal")
            ? "heal"
            : (lowerKey.includes("melee") ? "melee" : ""));
          const statIconHtml = statIcon
            ? (explicitTone
              ? `<span class="boon-stat-mask ${explicitTone}" style="-webkit-mask-image:url('${statIcon}');mask-image:url('${statIcon}');"></span>`
              : `<span class="boon-stat-icon"><img src="${statIcon}" alt="" loading="lazy" /></span>`)
            : "";
          return `<article class="boon-item"><div class="boon-top">${statIconHtml}${valueText}${iconHtml}</div><div class="boon-label">${entry.label}</div></article>`;
        })
        .join("");
    }

        weaponImageAEl.removeAttribute("src");

        weaponImageBEl.alt = "";

        weaponImageBEl.classList.remove("active");
        weaponHeaderMediaEl.classList.remove("visible");
        activeWeaponImageLayer = "a";
        return;

      const nextLayer = activeWeaponImageLayer === "a" ? weaponImageBEl : weaponImageAEl;
      const prevLayer = activeWeaponImageLayer === "a" ? weaponImageAEl : weaponImageBEl;
      nextLayer.src = imageUrl;
      nextLayer.alt = altText;
      nextLayer.classList.add("active");
      prevLayer.classList.remove("active");
      weaponHeaderMediaEl.classList.add("visible");

    function getCategoryStatIds(hero, category) {
      if (category === "weapon") {
        return [
          ...(hero.shop_stat_display?.weapon_stats_display?.display_stats || []),
          ...(hero.shop_stat_display?.weapon_stats_display?.other_display_stats || [])
        ];
      }
      if (category === "vitality") {
        return [
          ...(hero.shop_stat_display?.vitality_stats_display?.display_stats || []),
          ...(hero.shop_stat_display?.vitality_stats_display?.other_display_stats || [])
        ];
      }
      const spiritStats = [...(hero.shop_stat_display?.spirit_stats_display?.display_stats || [])];
      if (!spiritStats.includes("ETechPower")) spiritStats.unshift("ETechPower");
      return spiritStats;
    }

    function getHeroUiColor(hero) {
      const color = hero?.colors?.ui;
      if (Array.isArray(color) && color.length >= 3) {
        const r = Number(color[0]);
        const g = Number(color[1]);
        const b = Number(color[2]);
        if ([r, g, b].every((v) => Number.isFinite(v))) {
          return [Math.max(0, Math.min(255, r)), Math.max(0, Math.min(255, g)), Math.max(0, Math.min(255, b))];
        }
      }
      return [38, 25, 15];
    }

    function setHeroTintColor(hero) {
      const [r, g, b] = getHeroUiColor(hero);
      document.documentElement.style.setProperty("--hero-ui-r", String(r));
      document.documentElement.style.setProperty("--hero-ui-g", String(g));
      document.documentElement.style.setProperty("--hero-ui-b", String(b));
      const tintCss = [
        `radial-gradient(circle at 12% 15%, rgba(${r}, ${g}, ${b}, 0.42) 0%, rgba(${r}, ${g}, ${b}, 0.16) 42%, transparent 68%)`,
        `radial-gradient(circle at 88% 85%, rgba(${r}, ${g}, ${b}, 0.34) 0%, rgba(${r}, ${g}, ${b}, 0.12) 44%, transparent 70%)`,
        `linear-gradient(180deg, rgba(${r}, ${g}, ${b}, 0.2), rgba(8, 10, 12, 0.1))`
      ].join(",");

      const nextTintLayer = activeTintLayer === "a" ? heroTintBEl : heroTintAEl;
      const prevTintLayer = activeTintLayer === "a" ? heroTintAEl : heroTintBEl;
      nextTintLayer.style.background = tintCss;
      nextTintLayer.classList.add("active");
      prevTintLayer.classList.remove("active");
      activeTintLayer = activeTintLayer === "a" ? "b" : "a";
    }

    function heroLineColor(hero) {
      const [r, g, b] = getHeroUiColor(hero);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function metricValueAtLevel(metric, hero, weapon, displayLevel) {
      if (metric === "weapon") {
        const base = getBaseStatValue("EBulletDamage", hero, weapon);
        const per = getScalePerLevel("EBulletDamage", hero, {});
        if (base === null || base === undefined || Number.isNaN(base)) return null;
        return base + per * displayLevel;
      }
      if (metric === "health") {
        const base = getBaseStatValue("EMaxHealth", hero, weapon);
        const per = getScalePerLevel("EMaxHealth", hero, {});
        if (base === null || base === undefined || Number.isNaN(base)) return null;
        return base + per * displayLevel;
      }
      const base = getBaseStatValue("ETechPower", hero, weapon) || 0;
      const per = getScalePerLevel("ETechPower", hero, {});
      return base + per * displayLevel;
    }

    async function renderScalingGraph() {
      const selectedIds = [...selectedScalingHeroes];
      if (!selectedIds.length) {
        scalingChartEl.innerHTML = `<text x="600" y="215" text-anchor="middle" fill="#ccb79a" font-size="22">Select at least one hero.</text>`;
        return;
      }

      const models = await Promise.all(selectedIds.map((id) => getScalingModel(id)));
      const series = models.map((m) => ({
        name: m.name,
        color: m.color,
        values: m.points[scalingMetric].map((v) => (v === null || v === undefined || Number.isNaN(v) ? 0 : v))
      }));

      const all = series.flatMap((s) => s.values);
      let yMin = Math.min(...all);
      let yMax = Math.max(...all);
      if (yMin === yMax) {
        const pad = yMin === 0 ? 1 : Math.abs(yMin * 0.1);
        yMin -= pad;
        yMax += pad;
      }

      const width = 1200;
      const height = 600;
      const left = 68;
      const right = 22;
      const top = 18;
      const bottom = 34;
      const innerW = width - left - right;
      const innerH = height - top - bottom;
      const xForLevel = (level) => left + (level / 35) * innerW;
      const yForValue = (value) => top + (1 - (value - yMin) / (yMax - yMin)) * innerH;

      const yGrid = Array.from({ length: 6 }, (_, i) => yMin + ((yMax - yMin) * i) / 5);
      const xGrid = [0, 5, 10, 15, 20, 25, 30, 35];

      const gridLinesY = yGrid
        .map((value) => {
          const y = yForValue(value);
          return `<g><line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" stroke="rgba(255,220,170,0.15)" /><text x="${left - 8}" y="${y + 4}" text-anchor="end" fill="#cbb89d" font-size="12">${fullPrecision(value)}</text></g>`;
        })
        .join("");

      const gridLinesX = xGrid
        .map((level) => {
          const x = xForLevel(level);
          return `<g><line x1="${x}" y1="${top}" x2="${x}" y2="${height - bottom}" stroke="rgba(255,220,170,0.08)" /><text x="${x}" y="${height - 10}" text-anchor="middle" fill="#cbb89d" font-size="12">${level}</text></g>`;
        })
        .join("");

      const paths = series
        .map((s, idx) => {
          const d = s.values
            .map((v, idx) => `${idx === 0 ? "M" : "L"} ${xForLevel(idx)} ${yForValue(v)}`)
            .join(" ");
          return `<path class="series-line" data-series="${idx}" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" />
                  <path class="series-hit" data-series="${idx}" d="${d}" fill="none" stroke="transparent" stroke-width="14" />`;
        })
        .join("");

      const legend = series
        .map((s, idx) => `<g transform="translate(${left + idx * 170}, ${top - 2})"><rect x="0" y="-11" width="12" height="12" fill="${s.color}" /><text x="17" y="-1" fill="#e9dbc5" font-size="12">${s.name}</text></g>`)
        .join("");

      const yAxisLabel = scalingMetric === "weapon" ? "Weapon Damage" : (scalingMetric === "health" ? "Health" : "Spirit Power");

      scalingChartEl.innerHTML = `
        <rect x="0" y="0" width="${width}" height="${height}" fill="transparent"></rect>
        ${gridLinesY}
        ${gridLinesX}
        ${paths}
        ${legend}
        <text x="${left + innerW / 2}" y="${height - 4}" text-anchor="middle" fill="#e9dbc5" font-size="13">Boon (0-35)</text>
        <text x="20" y="${top + innerH / 2}" text-anchor="middle" fill="#e9dbc5" font-size="13" transform="rotate(-90 20 ${top + innerH / 2})">${yAxisLabel}</text>
      `;

      const lineEls = [...scalingChartEl.querySelectorAll(".series-line")];
      const hitEls = [...scalingChartEl.querySelectorAll(".series-hit")];
      const wrapEl = scalingChartEl.parentElement;

      const clearHover = () => {
        lineEls.forEach((lineEl) => lineEl.setAttribute("stroke-width", "2.2"));
        scalingTooltipEl.hidden = true;
      };

      const showHover = (seriesIndex, event) => {
        const s = series[seriesIndex];
        if (!s) return;
        lineEls.forEach((lineEl, idx) => lineEl.setAttribute("stroke-width", idx === seriesIndex ? "4.2" : "2.2"));

        const chartRect = scalingChartEl.getBoundingClientRect();
        const wrapRect = wrapEl.getBoundingClientRect();
        const leftPx = (left / width) * chartRect.width;
        const innerWPx = (innerW / width) * chartRect.width;
        const xWithin = Math.max(0, Math.min(chartRect.width, event.clientX - chartRect.left));
        const levelFloat = ((xWithin - leftPx) / Math.max(1, innerWPx)) * 35;
        const level = Math.max(0, Math.min(35, Math.round(levelFloat)));
        const value = s.values[level];

        scalingTooltipEl.innerHTML = `<strong>${s.name}</strong><br/>Boon ${level}: ${fullPrecision(value)}`;
        scalingTooltipEl.style.left = `${event.clientX - wrapRect.left}px`;
        scalingTooltipEl.style.top = `${event.clientY - wrapRect.top}px`;
        scalingTooltipEl.hidden = false;
      };

      hitEls.forEach((hitEl, idx) => {
        hitEl.onmousemove = (event) => showHover(idx, event);
        hitEl.onmouseenter = (event) => showHover(idx, event);
        hitEl.onmouseleave = clearHover;
      });

      scalingChartEl.onmouseleave = clearHover;
    }

    async function fetchItem(itemClassName) {
      if (!itemClassName) return null;
      if (itemCache.has(itemClassName)) return itemCache.get(itemClassName);
      const res = await fetch(`${ASSETS_API}/items/${itemClassName}`);
      if (!res.ok) return null;

    async function fetchAbilityBundle(itemRef) {
      const base = await fetchItem(itemRef);
      if (!base) return null;

      const refs = extractUpgradeRefs(base);
      const upgrades = (await Promise.all(refs.map(async ({ ref, tierHint }) => {
        const item = await fetchItem(ref);
        if (!item) return null;
        const tier = Number(item?.item_tier ?? item?.tier ?? tierHint ?? inferTierFromRef(ref, 0));
        return { ref, tier, item };
      }))).filter(Boolean);

      upgrades.sort((a, b) => a.tier - b.tier);
      return { base, upgrades };
    }

    function collectSpiritScaleEntries(abilities) {
      const entries = [];
      const seen = new Set();
      abilities.forEach((ability) => {
        if (!ability || !ability.properties) return;
        const abilityName = ability.name || toTitle(String(ability.class_name || "").replace(/^ability_/i, ""));
        const abilityIconUrl = ability.image_webp || ability.image || ability.icon_webp || ability.icon || "";
        Object.entries(ability.properties).forEach(([propertyKey, property]) => {
          const baseData = parseAbilityBaseValue(property);
          const candidates = [];
          if (property?.scale_function) {
            if (Array.isArray(property.scale_function)) candidates.push(...property.scale_function);
            else candidates.push(property.scale_function);
          }
          if (Array.isArray(property?.scale_functions)) candidates.push(...property.scale_functions);
          const validCandidates = candidates.filter((scaleFn) => scaleFn && !Number.isNaN(asNumber(scaleFn?.stat_scale)) && asNumber(scaleFn?.stat_scale) !== 0);
          if (!validCandidates.length) return;
          const hasSpiritScaling = validCandidates.some((scaleFn) => isSpiritScalingFunction(scaleFn));
          if (!hasSpiritScaling) return;
          const hasNonSpiritScaling = validCandidates.some((scaleFn) => !isSpiritScalingFunction(scaleFn));
          if (hasNonSpiritScaling) return;
          validCandidates.forEach((scaleFn) => {
            const statScale = asNumber(scaleFn?.stat_scale);
            if (!isSpiritScalingFunction(scaleFn) || Number.isNaN(statScale) || statScale === 0) return;
            const dedupeKey = `${ability.class_name || abilityName}|${propertyKey}|${statScale}`;
            if (seen.has(dedupeKey)) return;
            seen.add(dedupeKey);
            entries.push({
              ability: abilityName,
              property: property.label || property.postvalue_label || propertyKey,
              scale: statScale,
              iconUrl: abilityIconUrl,
              base: baseData.value,
              unit: baseData.unit
            });
          });
        });
      });
      return entries;
    }

    function renderCurrentLevel() {
      if (!currentModel) return;
      const displayLevel = Number(levelSliderEl.value);
      const level = displayLevel + 1;
      levelReadoutEl.textContent = String(displayLevel);

      const weaponRows = buildCategoryRows(currentModel.weaponStatIds, currentModel.hero, currentModel.weapon, level);
      const vitalityRows = buildCategoryRows(currentModel.vitalityStatIds, currentModel.hero, currentModel.weapon, level);
      const spiritRows = buildCategoryRows(currentModel.spiritStatIds, currentModel.hero, currentModel.weapon, level);

      const weaponSplit = splitWeaponRows(weaponRows);
      const vitalitySplit = splitVitalityRows(vitalityRows);

      renderStatGrid(weaponGridEl, weaponSplit.primary, "weapon");
      renderStatGrid(weaponGridSecondaryEl, weaponSplit.secondary, "weapon");
      weaponSecondaryWrapEl.style.display = weaponSplit.secondary.length ? "" : "none";

      renderStatGrid(vitalityGridEl, vitalitySplit.primary, "vitality");
      renderStatGrid(vitalityGridSecondaryEl, vitalitySplit.secondary, "vitality");
      vitalitySecondaryWrapEl.style.display = vitalitySplit.secondary.length ? "" : "none";

      renderStatGrid(spiritGridEl, spiritRows, "spirit");
      renderSpiritImpact(spiritRows);
      renderAbilities();
    }

    async function renderHeroById(heroId) {
      const hero = await fetchHero(heroId);
      const signatureIds = [hero.items?.signature1, hero.items?.signature2, hero.items?.signature3, hero.items?.signature4].filter(Boolean);
      const [weapon, ...abilityBundlesRaw] = await Promise.all([
        fetchWeapon(hero.items.weapon_primary),
        ...signatureIds.map((id) => fetchAbilityBundle(id))
      ]);

      const abilityBundles = abilityBundlesRaw.filter(Boolean);
      const validSignatureItems = abilityBundles.map((bundle) => bundle.base).filter(Boolean);
      currentModel = {
        hero,
        weapon,
        signatureItems: validSignatureItems,
        abilityBundles,
        abilityTiers: [0, 0, 0, 0],
        weaponStatIds: getCategoryStatIds(hero, "weapon"),
        vitalityStatIds: getCategoryStatIds(hero, "vitality"),
        spiritStatIds: getCategoryStatIds(hero, "spirit"),
        spiritScaleEntries: collectSpiritScaleEntries(validSignatureItems)
      };

      heroNameEl.textContent = hero.name;
      renderBoonStrip(hero);
      const heroBgUrl = hero.images?.background_image_webp || hero.images?.background_image || "";
      if (heroBgUrl) {
        const nextLayer = activeBgLayer === "a" ? heroBgBEl : heroBgAEl;
        const prevLayer = activeBgLayer === "a" ? heroBgAEl : heroBgBEl;
        nextLayer.style.backgroundImage = `url("${heroBgUrl}")`;
        nextLayer.classList.add("active");
        prevLayer.classList.remove("active");
        activeBgLayer = activeBgLayer === "a" ? "b" : "a";
      }
      setHeroTintColor(hero);
      weaponNameEl.textContent = getReadableWeaponName(hero, weapon);
      const falloffStart = weapon.weapon_info?.damage_falloff_start_range ? toMeters(weapon.weapon_info.damage_falloff_start_range) : null;
      const falloffEnd = weapon.weapon_info?.damage_falloff_end_range ? toMeters(weapon.weapon_info.damage_falloff_end_range) : null;
      const weaponImage = getWeaponDisplayImage(hero, weapon);
      setWeaponHeaderImage(weaponImage, `${weaponNameEl.textContent} image`);
      weaponTagsEl.innerHTML = "";
      (hero.shop_stat_display?.weapon_stats_display?.weapon_attributes || []).slice(0, 3).forEach((attr) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = String(attr).replace("EWeaponAttribute_", "").replace(/_/g, " ");
        weaponTagsEl.appendChild(tag);
      });
      if (falloffStart !== null && falloffEnd !== null) {
        const rangeTag = document.createElement("span");
        rangeTag.className = "tag";
        rangeTag.textContent = `${fullPrecision(falloffStart)}m → ${fullPrecision(falloffEnd)}m`;
        weaponTagsEl.appendChild(rangeTag);
      }
      levelSliderEl.value = "0";
      renderCurrentLevel();
    }

    function buildHeroButtons() {
      heroListEl.innerHTML = "";
      heroIndex.forEach((hero, index) => {
        const btn = document.createElement("button");
        btn.className = "hero-btn";
        btn.type = "button";
        const r = Array.isArray(hero.color) ? Number(hero.color[0]) : 214;
        const g = Array.isArray(hero.color) ? Number(hero.color[1]) : 181;
        const b = Array.isArray(hero.color) ? Number(hero.color[2]) : 138;
        btn.style.setProperty("--btn-r", String(Number.isFinite(r) ? r : 214));
        btn.style.setProperty("--btn-g", String(Number.isFinite(g) ? g : 181));
        btn.style.setProperty("--btn-b", String(Number.isFinite(b) ? b : 138));
        btn.innerHTML = `${hero.icon ? `<img class="hero-btn-icon" src="${hero.icon}" alt="" loading="lazy" />` : ""}<span>${hero.name}</span>`;

        btn.addEventListener("click", async () => {
          if (activeButton) activeButton.classList.remove("active");
          btn.classList.add("active");
          activeButton = btn;
          await renderHeroById(hero.id);
          if (selectedScalingHeroes.size === 1 && selectedScalingHeroes.has(hero.id) === false) {
            selectedScalingHeroes.clear();
            selectedScalingHeroes.add(hero.id);
            if (scalingReady) {
              buildScalingToggles();
              await renderScalingGraph();
            }
          }
        });

        heroListEl.appendChild(btn);

        if (index === 0) {
          btn.classList.add("active");
          activeButton = btn;
        }
      });
    }

    async function loadHeroes() {
      setLoadingState("Loading heroes from Deadlock API...");
      try {
        const res = await fetch(`${ASSETS_API}/heroes`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const playable = data
          .filter((hero) => hero.player_selectable && !hero.disabled);

        playable.forEach((hero) => {
          fullHeroCache.set(hero.id, hero);
        });

        heroIndex = playable
          .map((hero) => ({
            id: hero.id,
            name: hero.name,
            color: hero.colors?.ui || null,
            icon: hero.images?.icon_image_small_webp || hero.images?.icon_image_small || hero.icon_image_small || ""
          }))
          .sort((a, b) => a.name.localeCompare(b.name));

        if (!heroIndex.length) {
          setErrorState("The API returned no playable heroes.");
          return;
        }

        buildHeroButtons();
        await renderHeroById(heroIndex[0].id);
      } catch (error) {
        setErrorState("Could not load hero stats from Deadlock API.");
      }
    }

    metricTabsEl.addEventListener("click", async (event) => {
      const btn = event.target.closest(".metric-btn");
      if (!btn) return;
      const metric = btn.dataset.metric;
      if (!metric || metric === scalingMetric) return;
      scalingMetric = metric;
      [...metricTabsEl.querySelectorAll(".metric-btn")].forEach((el) => {
        el.classList.toggle("active", el === btn);
      });
      if (!scalingViewEl.hidden) await renderScalingGraph();
    });

    scalingHeroTogglesEl.addEventListener("change", async (event) => {
      const input = event.target.closest("input[data-hero-id]");
      if (!input) return;
      const heroId = Number(input.dataset.heroId);
      if (input.checked) selectedScalingHeroes.add(heroId);
      else selectedScalingHeroes.delete(heroId);
      await renderScalingGraph();
    });

    displayAllBtnEl.addEventListener("click", async () => {
      selectedScalingHeroes.clear();
      heroIndex.forEach((hero) => selectedScalingHeroes.add(hero.id));
      buildScalingToggles();
      await renderScalingGraph();
    });

    displayNoneBtnEl.addEventListener("click", async () => {
      selectedScalingHeroes.clear();
      buildScalingToggles();
      await renderScalingGraph();
    });

    levelSliderEl.addEventListener("input", renderCurrentLevel);

    loadIconsIndex().then(() => {
      if (currentModel) renderCurrentLevel();
    });
    setView("heroes");
    loadHeroes();
  </script>
</body>
</html>
