<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlock Hero HUD</title>
  <style>
    @font-face {
      font-family: "DeadlockSans";
      src: url("./fonts/retaildemo-regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSans";
      src: url("./fonts/retaildemo-semibold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSans";
      src: url("./fonts/retaildemo-bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockText";
      src: url("./fonts/retailtextdemo-regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockText";
      src: url("./fonts/retailtextdemo-bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSerif";
      src: url("./fonts/reaver-semibold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DeadlockSerif";
      src: url("./fonts/reaver-bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0b0f13;
      --text: #efe6d5;
      --muted: #a79a88;
      --line: rgba(255, 220, 170, 0.15);
      --weapon-1: #5c3a1f;
      --weapon-2: #2f2218;
      --vitality-1: #344124;
      --vitality-2: #1d2a18;
      --spirit-1: #4f3546;
      --spirit-2: #2a202f;
      --font-sans: "DeadlockSans";
      --font-text: "DeadlockText";
      --font-serif: "DeadlockSerif";
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #26190f 0%, transparent 42%),
        radial-gradient(circle at 90% 90%, #1d1e2d 0%, transparent 44%),
        var(--bg);
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
    }

    .hero-bg-layer {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 480ms ease;
      transform: scale(1.03);
    }

    .hero-bg-layer.active {
      opacity: 1;
    }

    .hero-bg-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(38, 25, 15, 0.7) 0%, transparent 42%),
        radial-gradient(circle at 90% 90%, rgba(29, 30, 45, 0.65) 0%, transparent 44%),
        linear-gradient(180deg, rgba(8, 10, 12, 0.68), rgba(8, 10, 12, 0.8));
      z-index: 1;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .container {
      width: min(1620px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }

    .hero-list {
      background: rgba(20, 16, 13, 0.86);
      border: 1px solid rgba(255, 220, 170, 0.16);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: sticky;
      top: 0.75rem;
      backdrop-filter: blur(6px);
    }

    .hero-btn {
      border: 1px solid #6b5a4a;
      background: rgba(45, 31, 22, 0.9);
      color: var(--text);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      transition: 120ms ease;
      font-size: 1rem;
    }

    .hero-btn:hover {
      border-color: #f2c37d;
      transform: translateY(-1px);
    }

    .hero-btn.active {
      border-color: #ffdca8;
      background: linear-gradient(135deg, #6b4a27, #3f2a1b);
      box-shadow: 0 0 0 1px rgba(255, 214, 151, 0.2), 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .hud {
      border: 1px solid rgba(255, 220, 170, 0.12);
      border-radius: 16px;
      background: linear-gradient(165deg, rgba(28, 21, 16, 0.94), rgba(17, 13, 10, 0.96));
      padding: 1rem;
    }

    .hud-header {
      display: grid;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 220, 170, 0.15);
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .hud-name {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      letter-spacing: 0.01em;
      text-transform: uppercase;
      font-family: var(--font-serif);
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .boon-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.42rem;
    }

    .boon-item {
      border: 1px solid rgba(255, 220, 170, 0.18);
      background: rgba(15, 11, 9, 0.45);
      border-radius: 6px;
      padding: 0.38rem 0.48rem;
      min-height: 52px;
      display: grid;
      align-content: center;
      gap: 0.14rem;
    }

    .boon-top {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.98rem;
      font-weight: 800;
      color: #fff1dd;
      font-family: var(--font-serif);
      line-height: 1.1;
    }

    .boon-label {
      font-size: 0.78rem;
      color: #ceb999;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-family: var(--font-text);
    }

    .boon-inline-icons {
      display: inline-flex;
      align-items: center;
      gap: 0;
      margin-left: 0.08rem;
    }

    .boon-inline-icon {
      width: 0.9rem;
      height: 0.9rem;
      object-fit: contain;
      transform: scale(1.48);
      transform-origin: center;
      position: relative;
      z-index: 1;
    }

    .boon-inline-icon + .boon-inline-icon {
      margin-left: -0.26rem;
      z-index: 2;
    }

    .controls {
      margin-top: 1rem;
      border-top: 1px solid rgba(255, 220, 170, 0.15);
      padding-top: 0.9rem;
      display: grid;
      gap: 0.4rem;
    }

    .level-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: var(--muted);
    }

    #level-slider {
      width: 100%;
      accent-color: #f0bb73;
      cursor: pointer;
    }

    .boards-grid {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(360px, 1fr));
      gap: 0.6rem;
    }

    .board {
      border: 1px solid rgba(255, 224, 176, 0.2);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255, 229, 181, 0.16);
    }

    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(rgba(255, 255, 255, 0.06) 0.7px, transparent 0.8px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.06), transparent 16%);
      background-size: 4px 4px, 100% 100%;
      opacity: 0.35;
    }

    .board.weapon {
      background: linear-gradient(160deg, #5f3f24, #2f2218);
    }

    .board.vitality {
      background: linear-gradient(160deg, #374627, #1d2a18);
    }

    .board.spirit {
      background: linear-gradient(160deg, #523748, #2a202f);
    }

    .board-header {
      display: grid;
      gap: 0.35rem;
      margin: 0;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid rgba(255, 220, 170, 0.2);
      background: rgba(0, 0, 0, 0.18);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .weapon-header-media {
      position: absolute;
      top: 0.1rem;
      right: 0.45rem;
      width: 60%;
      height: 5.3rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
      z-index: 0;
    }

    .weapon-header-media.visible {
      opacity: 0.96;
    }

    .weapon-image-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: right center;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.46));
      transform: translateX(0.35rem);
      opacity: 0;
      transition: opacity 480ms ease;
    }

    .weapon-image-layer.active {
      opacity: 1;
    }

    .board.weapon .board-title-row,
    .board.weapon .board-tags,
    .board.weapon .board-kicker {
      position: relative;
      z-index: 1;
      padding-right: 6.2rem;
    }

    .board-kicker {
      color: #e0d3bd;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: 0.84rem;
      font-weight: 800;
      line-height: 1;
      font-family: var(--font-serif);
    }

    .board-title-row {
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      align-items: baseline;
      flex-wrap: nowrap;
    }

    .board-title {
      margin: 0;
      font-size: 1.16rem;
      color: #fff5e6;
      line-height: 1.1;
      font-weight: 800;
      font-family: var(--font-sans);
      white-space: nowrap;
    }

    .board-summary {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      color: #f7ddbc;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      font-family: var(--font-serif);
    }

    .board-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.28rem;
    }

    .tag {
      border: 0;
      color: #f2d8b3;
      background: rgba(16, 12, 9, 0.6);
      border-radius: 4px;
      padding: 0.18rem 0.42rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: capitalize;
      font-family: var(--font-text);
    }

    .board-body {
      position: relative;
      z-index: 1;
      padding: 0.58rem;
      display: grid;
      gap: 0.52rem;
    }

    .stat-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.16rem;
    }

    .stat-row {
      border: 1px solid rgba(255, 220, 170, 0.12);
      background: rgba(0, 0, 0, 0.24);
      border-radius: 2px;
      padding: 0.4rem 0.52rem;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 0.28rem;
      overflow: hidden;
    }

    .stat-icon {
      width: 1.55rem;
      text-align: center;
      font-size: 1rem;
      line-height: 1;
      opacity: 0.98;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .stat-icon-img {
      width: 1.5rem;
      height: 1.5rem;
      object-fit: contain;
      opacity: 0.98;
    }

    .stat-icon-mask {
      width: 1.5rem;
      height: 1.5rem;
      display: inline-block;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .stat-icon-mask.weapon {
      background-color: #FF9900;
    }

    .stat-icon-mask.vitality {
      background-color: #00FF9A;
    }

    .stat-icon-mask.spirit {
      background-color: #CE91FF;
    }

    .stat-value {
      font-size: 1.02rem;
      font-weight: 800;
      color: #fff6e8;
      letter-spacing: 0.01em;
      font-family: var(--font-serif);
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .stat-scale {
      font-size: 0.88rem;
      font-weight: 800;
      color: #ffcb8b;
      font-family: var(--font-serif);
      white-space: nowrap;
      margin-left: 0.12rem;
      flex: 0 0 auto;
    }

    .stat-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #dbccb6;
      margin-left: auto;
      font-family: var(--font-text);
      min-width: 0;
      text-align: right;
      display: inline-flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.22rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .boon-icons {
      margin-left: 0.22rem;
      display: inline-flex;
      align-items: center;
      gap: 0;
      flex: 0 0 auto;
    }

    .boon-icon {
      width: 0.95rem;
      height: 0.95rem;
      object-fit: contain;
      opacity: 0.95;
      filter: grayscale(0.05) contrast(1.03);
      transform: scale(1.48);
      transform-origin: center;
      position: relative;
      z-index: 1;
    }

    .boon-icon + .boon-icon {
      margin-left: -0.28rem;
      z-index: 2;
    }

    .boon-icon-fallback {
      width: 0.95rem;
      height: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 800;
      color: #f3e7d6;
      background: rgba(255, 206, 145, 0.34);
      border: 1px solid rgba(255, 218, 166, 0.35);
      line-height: 1;
    }

    .stat-row.zero .stat-value,
    .stat-row.zero .stat-name {
      color: #9f9284;
    }

    .secondary-divider {
      border-top: 1px solid rgba(255, 220, 170, 0.22);
      margin: 0.25rem 0 0.1rem;
      padding-top: 0.5rem;
    }

    .impact-title {
      margin: 0;
      text-transform: uppercase;
      font-weight: 800;
      font-size: 0.82rem;
      color: #e6d7c1;
      letter-spacing: 0.02em;
      font-family: var(--font-serif);
    }

    .spirit-impact-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 0.38rem;
      margin-top: 0.32rem;
    }

    .spirit-power-card {
      border: 1px solid rgba(207, 158, 255, 0.3);
      background: rgba(13, 9, 17, 0.44);
      border-radius: 2px;
      min-height: 68px;
      padding: 0.55rem;
      display: grid;
      align-content: center;
      gap: 0.2rem;
    }

    .spirit-power-main {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 1.12rem;
      font-weight: 800;
      color: #e9d8ff;
    }

    .spirit-power-text {
      font-size: 1.04rem;
      line-height: 1.22;
      color: #ddd4e8;
    }

    .spirit-impact-list {
      display: grid;
      gap: 0.22rem;
    }

    .impact-row {
      border: 1px solid rgba(255, 220, 170, 0.12);
      background: rgba(0, 0, 0, 0.24);
      border-radius: 2px;
      padding: 0.44rem 0.52rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      min-height: 36px;
    }

    .impact-label {
      color: #d6c9bc;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: var(--font-text);
      display: inline-flex;
      align-items: center;
      gap: 0.48rem;
    }

    .impact-value {
      color: #f3e9dc;
      font-size: 1.02rem;
      font-weight: 800;
      min-width: 1.9rem;
      text-align: right;
      font-family: var(--font-serif);
    }

    @media (max-width: 640px) {
      .stat-grid {
        grid-template-columns: 1fr;
      }

      .spirit-impact-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1220px) {
      .boards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .boards-grid {
        grid-template-columns: 1fr;
      }
    }

    .impact-icon {
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 999px;
      background: rgba(228, 221, 223, 0.78);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .impact-icon img {
      width: 0.85rem;
      height: 0.85rem;
      object-fit: contain;
      filter: grayscale(1) contrast(1.15) brightness(0.33);
    }

    
  </style>
</head>
<body>
<div class="hero-bg" aria-hidden="true">
    <div id="hero-bg-a" class="hero-bg-layer active"></div>
    <div id="hero-bg-b" class="hero-bg-layer"></div>
    <div class="hero-bg-overlay"></div>
  </div>
<main class="container">
    <section id="hero-list" class="hero-list" aria-label="Hero list"></section>

    <section class="hud" aria-live="polite">
      <header class="hud-header">
        <div class="header-main">
          <h1 id="hero-name" class="hud-name"></h1>
        </div>
        <section id="boon-strip" class="boon-strip"></section>
      </header>

      <section class="controls">
        <div class="level-row">
          <span>Level</span>
          <strong id="level-readout">1</strong>
        </div>
        <input id="level-slider" type="range" min="1" max="36" step="1" value="1" />
      </section>

      <section class="boards-grid">
        <article class="board weapon">
          <header class="board-header">
            <div id="weapon-header-media" class="weapon-header-media">
              <img id="weapon-image-a" class="weapon-image-layer active" alt="" />
              <img id="weapon-image-b" class="weapon-image-layer" alt="" />
            </div>
            <div class="board-kicker">Weapon Stats</div>
            <div class="board-title-row">
              <h2 id="weapon-name" class="board-title">-</h2>
            </div>
            <div id="weapon-tags" class="board-tags"></div>
          </header>
          <div class="board-body">
            <div id="weapon-grid" class="stat-grid"></div>
            <div id="weapon-secondary-wrap" class="secondary-divider">
              <div id="weapon-grid-secondary" class="stat-grid"></div>
            </div>
          </div>
        </article>

        <article class="board vitality">
          <header class="board-header">
            <div class="board-kicker">Vitality Stats</div>
            <div class="board-title-row">
              <h2 class="board-title">Survivability</h2>
            </div>
          </header>
          <div class="board-body">
            <div id="vitality-grid" class="stat-grid"></div>
            <div id="vitality-secondary-wrap" class="secondary-divider">
              <div id="vitality-grid-secondary" class="stat-grid"></div>
            </div>
          </div>
        </article>

        <article class="board spirit">
          <header class="board-header">
            <div class="board-kicker">Spirit Stats</div>
            <div class="board-title-row">
              <h2 class="board-title">Ability Scaling</h2>
            </div>
          </header>
          <div class="board-body">
            <div id="spirit-grid" class="stat-grid"></div>
            <section id="spirit-impact-wrap" class="secondary-divider">
              <p class="impact-title">Spirit Power Impact</p>
              <div class="spirit-impact-grid">
                <div id="spirit-power-card" class="spirit-power-card"></div>
                <div id="spirit-impact-list" class="spirit-impact-list"></div>
              </div>
            </section>
          </div>
        </article>
      </section>
    </section>
  </main>

  <script>
    const ASSETS_API = "https://assets.deadlock-api.com/v2";
    const ICONS_API = "https://assets.deadlock-api.com/v1/icons";
    const heroListEl = document.getElementById("hero-list");
    const heroNameEl = document.getElementById("hero-name");
    const boonStripEl = document.getElementById("boon-strip");
    const levelSliderEl = document.getElementById("level-slider");
    const levelReadoutEl = document.getElementById("level-readout");
    const weaponNameEl = document.getElementById("weapon-name");
    const weaponTagsEl = document.getElementById("weapon-tags");
    const weaponHeaderMediaEl = document.getElementById("weapon-header-media");
    const weaponImageAEl = document.getElementById("weapon-image-a");
    const weaponImageBEl = document.getElementById("weapon-image-b");
    const weaponGridEl = document.getElementById("weapon-grid");
    const weaponGridSecondaryEl = document.getElementById("weapon-grid-secondary");
    const weaponSecondaryWrapEl = document.getElementById("weapon-secondary-wrap");
    const vitalityGridEl = document.getElementById("vitality-grid");
    const vitalityGridSecondaryEl = document.getElementById("vitality-grid-secondary");
    const vitalitySecondaryWrapEl = document.getElementById("vitality-secondary-wrap");
    const spiritGridEl = document.getElementById("spirit-grid");
    const spiritImpactWrapEl = document.getElementById("spirit-impact-wrap");
    const spiritPowerCardEl = document.getElementById("spirit-power-card");
    const spiritImpactListEl = document.getElementById("spirit-impact-list");
    const heroBgAEl = document.getElementById("hero-bg-a");
    const heroBgBEl = document.getElementById("hero-bg-b");

    let activeButton = null;
    let heroIndex = [];
    const fullHeroCache = new Map();
    const weaponCache = new Map();
    const itemCache = new Map();
    let iconsIndex = {};
    let currentModel = null;
    let activeBgLayer = "a";
    let activeWeaponImageLayer = "a";

    const STAT_LABELS = {
      EMaxHealth: "Max Health",
      EBaseHealthRegen: "Health Regen",
      EBulletArmorDamageReduction: "Bullet Resist",
      ETechArmorDamageReduction: "Spirit Resist",
      EMaxMoveSpeed: "Move Speed",
      ESprintSpeed: "Sprint Speed",
      EStamina: "Stamina",
      EBulletDamage: "Bullet Damage",
      ERoundsPerSecond: "Bullets per sec",
      EFireRate: "Fire Rate",
      EClipSize: "Ammo",
      EReloadTime: "Reload Time",
      EReloadSpeed: "Reload Reduction",
      EBulletSpeed: "Bullet Velocity",
      EWeaponDPS: "Damage / sec",
      ELightMeleeDamage: "Light Melee",
      EHeavyMeleeDamage: "Heavy Melee",
      ETechPower: "Spirit Power",
      ETechRange: "Ability Range",
      ETechDuration: "Ability Duration",
      ETechCooldown: "Ability Cooldown",
      ETechLifesteal: "Spirit Lifesteal",
      EMaxChargesIncrease: "Max Charges Increase",
      ETechCooldownBetweenChargeUses: "Charge Cooldown",
      EHealingOutput: "Heal Amp",
      EOOCHealthRegen: "Non-Combat Regen",
      EMeleeResist: "Melee Resist",
      EDebuffResist: "Debuff Resist",
      ECritDamageReceivedScale: "Crit Reduction",
      EBaseWeaponDamageIncrease: "Weapon Damage",
      EBulletSpeedIncrease: "Bullet Velocity Increase",
      EBulletLifesteal: "Bullet Lifesteal",
      ECritDamageBonusScale: "Crit Bonus Scale",
      EClipSizeIncrease: "Clip Size Increase",
      EDashSpeedInMeters: "Dash Speed",
      EStaminaCooldown: "Stamina Cooldown",
      EStaminaRegenIncrease: "Stamina Recovery"
    };

    const STAT_ICON_KEYS = {
      EBulletDamage: ["damage_bullet_color"],
      EBaseWeaponDamageIncrease: ["damage_bullet_color"],
      ERoundsPerSecond: ["fire_rate"],
      EFireRate: ["fire_rate"],
      EClipSize: ["ammo_clip_size"],
      EClipSizeIncrease: ["ammo_clip_size"],
      EReloadTime: ["ammo_reload"],
      EReloadSpeed: ["ammo_reload"],
      EBulletSpeed: ["bullet_velocity"],
      EBulletSpeedIncrease: ["bullet_velocity"],
      EWeaponDPS: ["health_stealing_bullets_color"],
      ELightMeleeDamage: ["damage_crit_color"],
      EHeavyMeleeDamage: ["citadel_build_tag_melee"],
      EBulletLifesteal: ["citadel_build_tag_melee"],
      ECritDamageBonusScale: ["damage_crit_color"],
      EMaxHealth: ["health"],
      EBaseHealthRegen: ["health_rege"],
      EOOCHealthRegen: ["healing_booster"],
      EHealingOutput: ["health_rege"],
      EBulletArmorDamageReduction: ["armor_bullet_color"],
      ETechArmorDamageReduction: ["armor_spirit_color"],
      EMeleeResist: ["armor_melee_color"],
      EDebuffResist: ["debuff_remove"],
      ECritDamageReceivedScale: ["damage_crit_color"],
      EMaxMoveSpeed: ["move_speed"],
      ESprintSpeed: ["move_sprint"],
      EDashSpeedInMeters: ["move_stamina_recharge"],
      EStamina: ["move_stamina_recharge"],
      EStaminaCooldown: ["move_stamina"],
      EStaminaRegenIncrease: ["move_stamina"],
      ETechPower: ["citadel_build_tag_spirit"],
      ETechCooldown: ["cooldow"],
      ETechDuration: ["duratio"],
      ETechRange: ["range_aoe"],
      ETechLifesteal: ["health_stealing_spirit_color"],
      EMaxChargesIncrease: ["charge"],
      ETechCooldownBetweenChargeUses: ["recharge"]
    };

    const COLOR_ICON_OVERRIDES = {
      damage_bullet: "damage_bullet_color",
      icon_damage_bullet: "damage_bullet_color",
      damage_melee: "damage_melee_color",
      damage_crit: "damage_crit_color",
      resist_bullet: "resist_bullet_color",
      resist_melee: "resist_melee_color",
      resist_spirit: "resist_spirit_color",
      armor_bullet: "armor_bullet_color",
      armor_melee: "armor_melee_color",
      armor_spirit: "armor_spirit_color",
      health_stealing_bullets: "health_stealing_bullets_color",
      health_stealing_melee: "health_stealing_melee_color",
      health_stealing_spirit: "health_stealing_spirit_color"
    };

    function asNumber(value) {
      return typeof value === "number" ? value : Number(value);
    }

    function round(value, places = 2) {
      if (value === null || value === undefined || Number.isNaN(value)) return null;
      const factor = 10 ** places;
      return Math.round(value * factor) / factor;
    }

    function compact(value, places = 2) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      const fixed = round(value, places).toFixed(places);
      return fixed.replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
    }

    function toTitle(value) {
      return String(value || "")
        .replace(/[_-]+/g, " ")
        .trim()
        .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function possessive(name) {
      const safe = String(name || "").trim();
      if (!safe) return "";
      return /s$/i.test(safe) ? `${safe}'` : `${safe}'s`;
    }

    const WEAPON_NAME_OVERRIDES = {
      citadel_weapon_bull_set: "Abrams' Shotgun"
    };

    function getReadableWeaponName(hero, weapon) {
      const rawName = String(weapon?.name || "").trim();
      const className = String(weapon?.class_name || "").trim();
      if (WEAPON_NAME_OVERRIDES[className]) return WEAPON_NAME_OVERRIDES[className];
      const looksInternal = !rawName || rawName === className || /^citadel_/i.test(rawName);
      if (!looksInternal) return rawName;

      const gunTag = String(hero?.gun_tag || "").trim();
      if (gunTag) return `${possessive(hero?.name)} ${toTitle(gunTag)}`;

      const cleaned = className
        .replace(/^citadel_weapon_/i, "")
        .replace(/_set$/i, "")
        .replace(/^hero_/i, "");
      return toTitle(cleaned || "Primary Weapon");
    }

    function getWeaponDisplayImage(hero, weapon) {
      return (
        hero?.shop_stat_display?.weapon_stats_display?.weapon_image_webp ||
        hero?.shop_stat_display?.weapon_stats_display?.weapon_image ||
        weapon?.image_webp ||
        weapon?.image ||
        ""
      );
    }

    function toMeters(sourceUnits) {
      return sourceUnits / 39.37;
    }

    function formatValue(value, statType) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      if (statType === "EBulletSpeed") return `${compact(value, 0)}m/s`;
      if (["EMaxMoveSpeed", "ESprintSpeed", "EDashSpeedInMeters"].includes(statType)) return `${compact(value, 1)}m`;
      if (statType.includes("Time") || statType.includes("Cooldown")) return `${compact(value, 2)}s`;
      if (
        statType.includes("Resist") ||
        statType.includes("BonusScale") ||
        statType.includes("Increase") ||
        statType.includes("Reduction") ||
        statType.includes("Lifesteal") ||
        statType === "ECritDamageReceivedScale"
      ) {
        return `${compact(value, 0)}%`;
      }
      if (statType === "ERoundsPerSecond" || statType === "EFireRate") return compact(value, 2);
      if (statType === "EWeaponDPS" || statType === "EClipSize" || statType.includes("Damage")) return compact(value, 0);
      return compact(value, 2);
    }

    function resolveIconKey(iconKey) {
      if (!iconKey) return "";
      const raw = String(iconKey).trim();
      if (!raw) return "";
      const baseKey = raw.replace(/_unfilled$/i, "");
      if (COLOR_ICON_OVERRIDES[baseKey] && iconsIndex[COLOR_ICON_OVERRIDES[baseKey]]) {
        return COLOR_ICON_OVERRIDES[baseKey];
      }
      if (iconsIndex[baseKey]) return baseKey;
      if (iconsIndex[raw]) return raw;
      return "";
    }

    function iconUrlFromKey(iconKey) {
      const resolved = resolveIconKey(iconKey);
      return resolved ? iconsIndex[resolved] : "";
    }

    function iconUrlForStat(statType) {
      const keys = STAT_ICON_KEYS[statType] || [];
      for (const key of keys) {
        const url = iconUrlFromKey(key);
        if (url) return url;
      }
      return iconUrlFromKey("damage_bullet_color") || "";
    }

    function iconDataForStat(statType) {
      const keys = STAT_ICON_KEYS[statType] || [];
      for (const key of keys) {
        const resolved = resolveIconKey(key);
        if (resolved) return { url: iconsIndex[resolved], key: resolved };
      }
      const fallback = resolveIconKey("damage_bullet_color");
      return fallback ? { url: iconsIndex[fallback], key: fallback } : { url: "", key: "" };
    }

    function iconNeedsTint(resolvedKey) {
      return !resolvedKey.includes("_color") && !resolvedKey.startsWith("citadel_build_tag_");
    }

    function getHeroFaceIconUrl(hero) {
      return (
        hero?.images?.icon_image_small_webp ||
        hero?.images?.icon_image_small ||
        hero?.icon_image_small ||
        ""
      );
    }

    async function loadIconsIndex() {
      try {
        const res = await fetch(ICONS_API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        iconsIndex = await res.json();
      } catch (error) {
        iconsIndex = {};
      }
    }

    function getScalePerLevel(statType, hero, baseValue) {
      const scale = hero.standard_level_up_upgrades || {};
      if (statType === "EMaxHealth") return asNumber(scale.MODIFIER_VALUE_BASE_HEALTH_FROM_LEVEL) || 0;
      if (statType === "EBulletArmorDamageReduction") return asNumber(scale.MODIFIER_VALUE_BULLET_ARMOR_DAMAGE_RESIST) || 0;
      if (statType === "ETechArmorDamageReduction") return asNumber(scale.MODIFIER_VALUE_TECH_ARMOR_DAMAGE_RESIST) || 0;
      if (statType === "ETechPower") return asNumber(scale.MODIFIER_VALUE_TECH_POWER) || 0;
      if (statType === "EBulletDamage") return asNumber(scale.MODIFIER_VALUE_BASE_BULLET_DAMAGE_FROM_LEVEL) || 0;
      if (statType === "ELightMeleeDamage") return asNumber(scale.MODIFIER_VALUE_BASE_MELEE_DAMAGE_FROM_LEVEL) || 0;
      if (statType === "EHeavyMeleeDamage") {
        const lightBase = asNumber(baseValue.lightBase) || 0;
        const heavyBase = asNumber(baseValue.heavyBase) || 0;
        const lightScale = asNumber(scale.MODIFIER_VALUE_BASE_MELEE_DAMAGE_FROM_LEVEL) || 0;
        return lightBase > 0 ? (heavyBase / lightBase) * lightScale : 0;
      }
      return 0;
    }

    function getBaseStatValue(statType, hero, weapon) {
      const s = hero.starting_stats || {};
      const w = weapon.weapon_info || {};
      const fromStarting = (key) => asNumber(s[key]?.value);

      switch (statType) {
        case "EMaxHealth":
          return fromStarting("max_health");
        case "EBaseHealthRegen":
          return fromStarting("base_health_regen");
        case "EBulletArmorDamageReduction":
        case "ETechArmorDamageReduction":
        case "EHealingOutput":
        case "EOOCHealthRegen":
        case "EMeleeResist":
        case "EDebuffResist":
        case "ETechLifesteal":
        case "EMaxChargesIncrease":
        case "ETechCooldownBetweenChargeUses":
        case "EBaseWeaponDamageIncrease":
        case "EBulletSpeedIncrease":
        case "EBulletLifesteal":
        case "ECritDamageBonusScale":
        case "EClipSizeIncrease":
        case "EStaminaCooldown":
        case "EStaminaRegenIncrease":
          return 0;
        case "EMaxMoveSpeed":
          return fromStarting("max_move_speed");
        case "ESprintSpeed":
          return fromStarting("sprint_speed");
        case "EStamina":
          return fromStarting("stamina");
        case "EDashSpeedInMeters":
          return 14.3;
        case "EBulletDamage":
          return asNumber(w.bullet_damage);
        case "ERoundsPerSecond":
        case "EFireRate":
          return asNumber(w.shots_per_second);
        case "EClipSize":
          return asNumber(w.clip_size);
        case "EReloadTime":
          return asNumber(w.reload_duration);
        case "EReloadSpeed":
          return fromStarting("reload_speed");
        case "EBulletSpeed":
          return w.bullet_speed ? toMeters(asNumber(w.bullet_speed)) : null;
        case "EWeaponDPS":
          return asNumber(w.damage_per_second);
        case "ELightMeleeDamage":
          return fromStarting("light_melee_damage");
        case "EHeavyMeleeDamage":
          return fromStarting("heavy_melee_damage");
        case "ETechPower":
          return fromStarting("tech_power") || 0;
        case "ETechRange":
          return fromStarting("tech_range");
        case "ETechDuration":
          return fromStarting("tech_duration");
        case "ETechCooldown":
          return 0;
        case "ECritDamageReceivedScale":
          return fromStarting("crit_damage_received_scale");
        default:
          return null;
      }
    }

    function buildCategoryRows(statIds, hero, weapon, level) {
      return statIds.map((statType) => {
        const lightBase = getBaseStatValue("ELightMeleeDamage", hero, weapon);
        const heavyBase = getBaseStatValue("EHeavyMeleeDamage", hero, weapon);
        const base = getBaseStatValue(statType, hero, weapon);
        const perLevel = getScalePerLevel(statType, hero, { lightBase, heavyBase });
        const current = base === null ? null : base + perLevel * (level - 1);
        return {
          statType,
          label: STAT_LABELS[statType] || statType,
          base,
          current,
          perLevel
        };
      });
    }

    function renderStatGrid(container, rows, category) {
      container.innerHTML = "";
      const heroFaceIcon = getHeroFaceIconUrl(currentModel?.hero);
      const boonArrowIcon = iconUrlFromKey("keystat_boon_arrow");
      rows.forEach((row) => {
        const statRow = document.createElement("article");
        const isZero = row.current === 0;
        const hasBoonScaling = row.perLevel !== 0;
        const scaleText = hasBoonScaling ? `+${compact(row.perLevel, 2)}` : "";
        const boonIconsHtml = hasBoonScaling
          ? `<span class="boon-icons">${boonArrowIcon ? `<img class="boon-icon" src="${boonArrowIcon}" alt="" loading="lazy" />` : `<span class="boon-icon-fallback">^</span>`}${heroFaceIcon ? `<img class="boon-icon" src="${heroFaceIcon}" alt="" loading="lazy" />` : `<span class="boon-icon-fallback">H</span>`}</span>`
          : "";
        const { url: iconUrl, key: iconKey } = iconDataForStat(row.statType);
        const useMaskTint = iconUrl && iconNeedsTint(iconKey);
        const iconHtml = useMaskTint
          ? `<span class="stat-icon-mask ${category}" style="-webkit-mask-image:url('${iconUrl}');mask-image:url('${iconUrl}');"></span>`
          : (iconUrl ? `<img class="stat-icon-img" src="${iconUrl}" alt="" loading="lazy" />` : "");
        statRow.className = `stat-row ${isZero ? "zero" : ""}`;
        statRow.innerHTML = `
          <span class="stat-icon">${iconHtml}</span>
          <span class="stat-value">${formatValue(row.current, row.statType)}</span>
          ${hasBoonScaling ? `<span class="stat-scale">${scaleText}</span>` : ""}
          <span class="stat-name">${row.label}${boonIconsHtml}</span>
        `;
        container.appendChild(statRow);
      });
    }

    function splitWeaponRows(rows) {
      const melee = new Set(["ELightMeleeDamage", "EHeavyMeleeDamage"]);
      return {
        primary: rows.filter((r) => !melee.has(r.statType)),
        secondary: rows.filter((r) => melee.has(r.statType))
      };
    }

    function splitVitalityRows(rows) {
      const mobility = new Set([
        "EMaxMoveSpeed",
        "ESprintSpeed",
        "EStaminaCooldown",
        "EStaminaRegenIncrease",
        "EStamina",
        "EDashSpeedInMeters"
      ]);
      return {
        primary: rows.filter((r) => !mobility.has(r.statType)),
        secondary: rows.filter((r) => mobility.has(r.statType))
      };
    }

    function renderSpiritImpact(rows) {
      const spiritPowerRow = rows.find((row) => row.statType === "ETechPower");
      const spiritPower = spiritPowerRow?.current ?? 0;
      const spiritPerLevel = spiritPowerRow?.perLevel ?? 0;
      const spiritBase = spiritPowerRow?.base ?? 0;
      const level = Number(levelSliderEl.value);
      const gainedFromLevels = spiritPerLevel * (level - 1);
      const spiritPowerIcon = iconUrlFromKey("citadel_build_tag_spirit") || iconUrlFromKey("keystat_spirit_arrow") || iconUrlFromKey("spirit");
      spiritPowerCardEl.innerHTML = `
        <div class="spirit-power-main"><span class="stat-icon">${spiritPowerIcon ? `<img class="stat-icon-img" src="${spiritPowerIcon}" alt="" loading="lazy" />` : ""}</span><span>${formatValue(spiritPower, "ETechPower")} Spirit Power</span></div>
        <div class="spirit-power-text">Level ${level}: Base ${compact(spiritBase, 2)} + ${compact(spiritPerLevel, 2)}/lvl = +${compact(gainedFromLevels, 2)} from levels.</div>
      `;

      const impactRows = (currentModel?.spiritScaleEntries || [])
        .map((entry) => ({
          label: `${entry.ability} - ${entry.property}`,
          value: `${compact(spiritPower * entry.scale, 2)} (${entry.scale >= 0 ? "+" : ""}${compact(spiritPerLevel * entry.scale, 2)}/lvl)`,
          iconUrl: entry.iconUrl || "",
          absCurrent: Math.abs(spiritPower * entry.scale)
        }))
        .sort((a, b) => b.absCurrent - a.absCurrent);

      if (!impactRows.length) {
        spiritImpactListEl.innerHTML = `<div class="impact-row"><span class="impact-label">No hero-specific spirit scaling entries found.</span><span class="impact-value">-</span></div>`;
      } else {
        spiritImpactListEl.innerHTML = impactRows
          .slice(0, 8)
          .map((row) => `<div class="impact-row"><span class="impact-label">${row.iconUrl ? `<span class="impact-icon"><img src="${row.iconUrl}" alt="" loading="lazy" /></span>` : ""} ${row.label}</span><span class="impact-value">${row.value}</span></div>`)
          .join("");
      }
      spiritImpactWrapEl.style.display = "";
    }

    function renderBoonStrip(hero) {
      const scale = hero?.standard_level_up_upgrades || {};
      const heroFace = getHeroFaceIconUrl(hero);
      const arrow = iconUrlFromKey("keystat_boon_arrow");
      const iconTrail = `${heroFace ? `<img class="boon-inline-icon" src="${heroFace}" alt="" loading="lazy" />` : ""}${arrow ? `<img class="boon-inline-icon" src="${arrow}" alt="" loading="lazy" />` : ""}`;
      const iconHtml = iconTrail ? `<span class="boon-inline-icons">${iconTrail}</span>` : "";

      const boons = [
        { value: asNumber(scale.MODIFIER_VALUE_BASE_HEALTH_FROM_LEVEL) || 0, label: "Health / Level" },
        { value: asNumber(scale.MODIFIER_VALUE_BASE_BULLET_DAMAGE_FROM_LEVEL) || 0, label: "Bullet Damage / Level" },
        { value: asNumber(scale.MODIFIER_VALUE_BASE_MELEE_DAMAGE_FROM_LEVEL) || 0, label: "Melee Damage / Level" },
        { value: asNumber(scale.MODIFIER_VALUE_TECH_POWER) || 0, label: "Spirit Power / Level" },
        { value: asNumber(scale.MODIFIER_VALUE_BULLET_ARMOR_DAMAGE_RESIST) || 0, label: "Bullet Resist / Level" },
        { value: asNumber(scale.MODIFIER_VALUE_TECH_ARMOR_DAMAGE_RESIST) || 0, label: "Spirit Resist / Level" }
      ].filter((entry) => entry.value !== 0);

      if (!boons.length) {
        boonStripEl.innerHTML = "";
        return;
      }

      boonStripEl.innerHTML = boons
        .map((entry) => {
          const valueText = `+${compact(entry.value, 2)}`;
          return `<article class="boon-item"><div class="boon-top">${valueText}${iconHtml}</div><div class="boon-label">${entry.label}</div></article>`;
        })
        .join("");
    }

    function setWeaponHeaderImage(imageUrl, altText) {
      if (!imageUrl) {
        weaponImageAEl.removeAttribute("src");
        weaponImageBEl.removeAttribute("src");
        weaponImageAEl.alt = "";
        weaponImageBEl.alt = "";
        weaponImageAEl.classList.add("active");
        weaponImageBEl.classList.remove("active");
        weaponHeaderMediaEl.classList.remove("visible");
        activeWeaponImageLayer = "a";
        return;
      }

      const nextLayer = activeWeaponImageLayer === "a" ? weaponImageBEl : weaponImageAEl;
      const prevLayer = activeWeaponImageLayer === "a" ? weaponImageAEl : weaponImageBEl;
      nextLayer.src = imageUrl;
      nextLayer.alt = altText;
      nextLayer.classList.add("active");
      prevLayer.classList.remove("active");
      weaponHeaderMediaEl.classList.add("visible");
      activeWeaponImageLayer = activeWeaponImageLayer === "a" ? "b" : "a";
    }

    function getCategoryStatIds(hero, category) {
      if (category === "weapon") {
        return [
          ...(hero.shop_stat_display?.weapon_stats_display?.display_stats || []),
          ...(hero.shop_stat_display?.weapon_stats_display?.other_display_stats || [])
        ];
      }
      if (category === "vitality") {
        return [
          ...(hero.shop_stat_display?.vitality_stats_display?.display_stats || []),
          ...(hero.shop_stat_display?.vitality_stats_display?.other_display_stats || [])
        ];
      }
      return [...(hero.shop_stat_display?.spirit_stats_display?.display_stats || [])];
    }

    async function fetchHero(heroId) {
      if (fullHeroCache.has(heroId)) return fullHeroCache.get(heroId);
      const res = await fetch(`${ASSETS_API}/heroes/${heroId}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const hero = await res.json();
      fullHeroCache.set(heroId, hero);
      return hero;
    }

    async function fetchWeapon(weaponClassName) {
      if (weaponCache.has(weaponClassName)) return weaponCache.get(weaponClassName);
      const res = await fetch(`${ASSETS_API}/items/${weaponClassName}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const weapon = await res.json();
      weaponCache.set(weaponClassName, weapon);
      return weapon;
    }

    async function fetchItem(itemClassName) {
      if (!itemClassName) return null;
      if (itemCache.has(itemClassName)) return itemCache.get(itemClassName);
      const res = await fetch(`${ASSETS_API}/items/${itemClassName}`);
      if (!res.ok) return null;
      const item = await res.json();
      itemCache.set(itemClassName, item);
      return item;
    }

    function collectSpiritScaleEntries(abilities) {
      const entries = [];
      abilities.forEach((ability) => {
        if (!ability || !ability.properties) return;
        Object.entries(ability.properties).forEach(([propertyKey, property]) => {
          const scaleFn = property?.scale_function;
          const scaleType = scaleFn?.specific_stat_scale_type;
          const statScale = asNumber(scaleFn?.stat_scale);
          if (scaleType !== "ETechPower" || Number.isNaN(statScale) || statScale === 0) return;
          entries.push({
            ability: ability.name || toTitle(String(ability.class_name || "").replace(/^ability_/i, "")),
            property: property.label || property.postvalue_label || propertyKey,
            scale: statScale,
            iconUrl: property.icon || ""
          });
        });
      });
      return entries;
    }

    function renderCurrentLevel() {
      if (!currentModel) return;
      const level = Number(levelSliderEl.value);
      levelReadoutEl.textContent = String(level);

      const weaponRows = buildCategoryRows(currentModel.weaponStatIds, currentModel.hero, currentModel.weapon, level);
      const vitalityRows = buildCategoryRows(currentModel.vitalityStatIds, currentModel.hero, currentModel.weapon, level);
      const spiritRows = buildCategoryRows(currentModel.spiritStatIds, currentModel.hero, currentModel.weapon, level);

      const weaponSplit = splitWeaponRows(weaponRows);
      const vitalitySplit = splitVitalityRows(vitalityRows);

      renderStatGrid(weaponGridEl, weaponSplit.primary, "weapon");
      renderStatGrid(weaponGridSecondaryEl, weaponSplit.secondary, "weapon");
      weaponSecondaryWrapEl.style.display = weaponSplit.secondary.length ? "" : "none";

      renderStatGrid(vitalityGridEl, vitalitySplit.primary, "vitality");
      renderStatGrid(vitalityGridSecondaryEl, vitalitySplit.secondary, "vitality");
      vitalitySecondaryWrapEl.style.display = vitalitySplit.secondary.length ? "" : "none";

      renderStatGrid(spiritGridEl, spiritRows, "spirit");
      renderSpiritImpact(spiritRows);
    }

    async function renderHeroById(heroId) {
      const hero = await fetchHero(heroId);
      const signatureIds = [hero.items?.signature1, hero.items?.signature2, hero.items?.signature3, hero.items?.signature4].filter(Boolean);
      const [weapon, ...signatureItems] = await Promise.all([
        fetchWeapon(hero.items.weapon_primary),
        ...signatureIds.map((id) => fetchItem(id))
      ]);
      currentModel = {
        hero,
        weapon,
        weaponStatIds: getCategoryStatIds(hero, "weapon"),
        vitalityStatIds: getCategoryStatIds(hero, "vitality"),
        spiritStatIds: getCategoryStatIds(hero, "spirit"),
        spiritScaleEntries: collectSpiritScaleEntries(signatureItems.filter(Boolean))
      };

      heroNameEl.textContent = hero.name;
      renderBoonStrip(hero);
      const heroBgUrl = hero.images?.background_image_webp || hero.images?.background_image || "";
      if (heroBgUrl) {
        const nextLayer = activeBgLayer === "a" ? heroBgBEl : heroBgAEl;
        const prevLayer = activeBgLayer === "a" ? heroBgAEl : heroBgBEl;
        nextLayer.style.backgroundImage = `url("${heroBgUrl}")`;
        nextLayer.classList.add("active");
        prevLayer.classList.remove("active");
        activeBgLayer = activeBgLayer === "a" ? "b" : "a";
      }
      weaponNameEl.textContent = getReadableWeaponName(hero, weapon);
      const falloffStart = weapon.weapon_info?.damage_falloff_start_range ? round(toMeters(weapon.weapon_info.damage_falloff_start_range), 0) : null;
      const falloffEnd = weapon.weapon_info?.damage_falloff_end_range ? round(toMeters(weapon.weapon_info.damage_falloff_end_range), 0) : null;
      const weaponImage = getWeaponDisplayImage(hero, weapon);
      setWeaponHeaderImage(weaponImage, `${weaponNameEl.textContent} image`);
      weaponTagsEl.innerHTML = "";
      (hero.shop_stat_display?.weapon_stats_display?.weapon_attributes || []).slice(0, 3).forEach((attr) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = String(attr).replace("EWeaponAttribute_", "").replace(/_/g, " ");
        weaponTagsEl.appendChild(tag);
      });
      if (falloffStart !== null && falloffEnd !== null) {
        const rangeTag = document.createElement("span");
        rangeTag.className = "tag";
        rangeTag.textContent = `${falloffStart}m → ${falloffEnd}m`;
        weaponTagsEl.appendChild(rangeTag);
      }
      levelSliderEl.value = "1";
      renderCurrentLevel();
    }

    function resetHUD() {
      weaponGridEl.innerHTML = "";
      weaponGridSecondaryEl.innerHTML = "";
      vitalityGridEl.innerHTML = "";
      vitalityGridSecondaryEl.innerHTML = "";
      spiritGridEl.innerHTML = "";
      spiritPowerCardEl.innerHTML = "";
      spiritImpactListEl.innerHTML = "";
      weaponNameEl.textContent = "-";
      weaponTagsEl.innerHTML = "";
      setWeaponHeaderImage("", "");
    }

    function setLoadingState(text) {
      heroNameEl.textContent = text;
      boonStripEl.innerHTML = "";
      resetHUD();
    }

    function setErrorState(message) {
      heroNameEl.textContent = "Failed to load heroes";
      boonStripEl.innerHTML = `<article class="boon-item"><div class="boon-label">${message}</div></article>`;
      resetHUD();
    }

    function buildHeroButtons() {
      heroListEl.innerHTML = "";
      heroIndex.forEach((hero, index) => {
        const btn = document.createElement("button");
        btn.className = "hero-btn";
        btn.type = "button";
        btn.textContent = hero.name;

        btn.addEventListener("click", async () => {
          if (activeButton) activeButton.classList.remove("active");
          btn.classList.add("active");
          activeButton = btn;
          await renderHeroById(hero.id);
        });

        heroListEl.appendChild(btn);

        if (index === 0) {
          btn.classList.add("active");
          activeButton = btn;
        }
      });
    }

    async function loadHeroes() {
      setLoadingState("Loading heroes from Deadlock API...");
      try {
        const res = await fetch(`${ASSETS_API}/heroes`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        heroIndex = data
          .filter((hero) => hero.player_selectable && !hero.disabled)
          .map((hero) => ({ id: hero.id, name: hero.name }))
          .sort((a, b) => a.name.localeCompare(b.name));

        if (!heroIndex.length) {
          setErrorState("The API returned no playable heroes.");
          return;
        }

        buildHeroButtons();
        await renderHeroById(heroIndex[0].id);
      } catch (error) {
        setErrorState("Could not load hero stats from Deadlock API.");
      }
    }

    levelSliderEl.addEventListener("input", renderCurrentLevel);

    loadIconsIndex().then(() => {
      if (currentModel) renderCurrentLevel();
    });
    loadHeroes();
  </script>
</body>
</html>
