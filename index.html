<!DOCTYPE html>
<!--
  DEADLOCK HERO BROWSER
  A beginner HTML project demonstrating:
  - Document structure (DOCTYPE, head, body)
  - Semantic elements (header, main, section, article, footer)
  - Forms & inputs (search, select)
  - CSS custom properties, Grid, Flexbox
  - JavaScript: fetch(), async/await, DOM manipulation, events
-->
<html lang="en">
<head>
  <!-- charset must be first — tells the browser how to read the file -->
  <meta charset="UTF-8">
  <!-- viewport makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadlock — Hero Browser</title>

  <style>
    /* ── Design tokens (CSS variables) ─────────────────────────────────── */
    :root {
      --bg:       #0a0c0f;
      --surface:  #13171e;
      --surface2: #1c2028;
      --border:   #2a3040;
      --text:     #dde4ee;
      --muted:    #7a8799;
      --accent:   #4ecdc4;   /* teal */
      --gold:     #f0a500;   /* amber / complexity dots */
      --danger:   #f85149;
    }

    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── HEADER ─────────────────────────────────────────────────────────── */
    /* <header> is a semantic landmark — screen readers announce it */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;   /* stays at top when scrolling */
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
      white-space: nowrap;
    }

    header h1 span {
      color: var(--muted);
      font-weight: 400;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-left: 0.5rem;
    }

    /* ── SEARCH & FILTER CONTROLS ───────────────────────────────────────── */
    .controls {
      display: flex;
      gap: 0.6rem;
      flex: 1;
      flex-wrap: wrap;
    }

    /* Shared style for text input and selects */
    .controls input,
    .controls select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .controls input { flex: 1; min-width: 140px; }
    .controls input:focus,
    .controls select:focus { border-color: var(--accent); }
    .controls select { cursor: pointer; }

    /* ── MAIN CONTENT AREA ──────────────────────────────────────────────── */
    /* <main> contains the primary content; there should be only one per page */
    main {
      padding: 1.5rem 2rem 3rem;
      max-width: 1440px;
      margin: 0 auto;
    }

    /* ── STATUS BAR (result count + sort) ──────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.83rem;
      color: var(--muted);
    }

    /* ── HERO GRID ──────────────────────────────────────────────────────── */
    /*
      CSS Grid with auto-fill: the browser decides how many columns fit.
      minmax(150px, 1fr) = each column is at least 150px, but can grow.
    */
    #hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 1rem;
    }

    /* ── HERO CARD ──────────────────────────────────────────────────────── */
    /*
      <article> is the right element for a self-contained piece of content
      (a card, a post, a product) that could stand alone.
    */
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .hero-card:hover,
    .hero-card:focus-visible {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(78, 205, 196, 0.15);
      outline: none;
    }

    /* Hero portrait image */
    .hero-card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: top;
      display: block;
      background: var(--surface2);   /* placeholder color while loading */
    }

    .hero-card .card-info {
      padding: 0.6rem 0.75rem 0.75rem;
    }

    .hero-card h3 {
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-card .role-label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 1px;
      text-transform: capitalize;
    }

    /* Complexity dots: filled = gold, empty = border color */
    .complexity-dots {
      display: flex;
      gap: 3px;
      margin-top: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
    }
    .dot.filled { background: var(--gold); }

    /* ── LOADING / ERROR STATES ─────────────────────────────────────────── */
    #loading, #error-msg {
      grid-column: 1 / -1;   /* span all columns when inside a grid */
      text-align: center;
      padding: 4rem 1rem;
      font-size: 1rem;
    }
    #loading { color: var(--muted); }
    #error-msg { color: var(--danger); display: none; }

    /* Simple CSS spinner */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MODAL OVERLAY ──────────────────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;               /* shorthand for top/right/bottom/left: 0 */
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      padding: 2rem 1rem;
      overflow-y: auto;
    }

    #modal-overlay.open { display: flex; justify-content: center; align-items: flex-start; }

    /* The modal box itself */
    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 680px;
      width: 100%;
      overflow: hidden;
      position: relative;
      animation: slide-up 0.2s ease;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.55rem;
      z-index: 10;
      line-height: 1.5;
      transition: border-color 0.15s, color 0.15s;
    }
    #modal-close:hover { border-color: var(--danger); color: var(--danger); }

    /* Wide banner at the top of the modal */
    #modal-banner {
      width: 100%;
      height: 220px;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    #modal-body { padding: 1.5rem; }

    /* Hero name */
    #modal-body h2 { font-size: 1.7rem; margin-bottom: 0.15rem; }

    /* Role / weapon type line */
    .modal-meta {
      color: var(--accent);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    /* Lore / playstyle text */
    .lore-text {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.65;
      margin-bottom: 1.5rem;
    }

    /* Section heading inside the modal */
    .modal-section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 0.6rem;
      margin-top: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35rem;
    }

    /*
      <dl> = description list. Perfect for key-value data like stats.
      <dt> = term (the label), <dd> = description (the value).
    */
    dl.stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 2rem;
      font-size: 0.85rem;
    }

    dl.stats div {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border);
    }

    dl.stats dt { color: var(--muted); }
    dl.stats dd { font-weight: 600; color: var(--text); }

    /* Tag chips */
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }

    .tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: capitalize;
    }

    /* ── VIEW TABS (header nav) ─────────────────────────────────────────── */
    .view-tabs {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .view-tab {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.4rem 0.85rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .view-tab:hover { border-color: var(--accent); color: var(--text); }
    .view-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0c0f;
      font-weight: 600;
    }

    /* ── SCALING GRAPH SECTION ──────────────────────────────────────────── */
    #scaling-section { display: none; }

    .scaling-toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .stat-tabs {
      display: flex;
      gap: 0.35rem;
    }

    .stat-tab {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 0.4rem 1rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .stat-tab:hover { border-color: var(--accent); color: var(--text); }
    .stat-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0c0f;
      font-weight: 600;
    }

    .toggle-all-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.35rem 0.8rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .toggle-all-btn:hover { border-color: var(--text); color: var(--text); }

    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 0.5rem 0.5rem;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    #scaling-chart {
      display: block;
      width: 100%;
      height: 420px;
    }

    /* ── CHART LEGEND ───────────────────────────────────────────────────── */
    #chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem 0.3rem 0.5rem;
      transition: opacity 0.15s, border-color 0.15s;
      user-select: none;
    }
    .legend-item:hover { border-color: var(--accent); }
    .legend-item.hidden {
      opacity: 0.35;
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── FOOTER ─────────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── RESPONSIVE TWEAKS ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: stretch; }
      main { padding: 1rem 1rem 3rem; }
      dl.stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       HEADER — sticky top bar with branding and search controls
  ════════════════════════════════════════════════════════════════════════ -->
  <header>
    <h1>Deadlock <span>Hero Browser</span></h1>

    <div class="view-tabs">
      <button class="view-tab active" id="tab-browser">Hero Browser</button>
      <button class="view-tab" id="tab-scaling">Scaling Graph</button>
    </div>

    <!-- Controls: search input + two filter dropdowns -->
    <div class="controls" role="search">

      <!--
        type="search" gives you a clear (✕) button in most browsers.
        aria-label helps screen readers announce the field's purpose.
      -->
      <input
        type="search"
        id="search"
        placeholder="Search heroes…"
        aria-label="Search heroes by name"
        autocomplete="off"
      >

      <!--
        <select> creates a dropdown.
        Options are added dynamically by JavaScript once we know the roles.
      -->
      <select id="filter-role" aria-label="Filter by role">
        <option value="">All Roles</option>
        <!-- populated by JS -->
      </select>

      <select id="filter-complexity" aria-label="Filter by complexity">
        <option value="">Any Difficulty</option>
        <option value="1">Easy</option>
        <option value="2">Medium</option>
        <option value="3">Hard</option>
      </select>

    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════════════════
       MAIN — primary page content
  ════════════════════════════════════════════════════════════════════════ -->
  <main>

    <!-- Status bar: shows how many heroes match the current filters -->
    <div class="status-bar">
      <span id="result-count"></span>
    </div>

    <!--
      <section> groups related content. aria-label gives it an accessible name.
      Hero cards are injected here by JavaScript.
    -->
    <section id="hero-grid" aria-label="Hero roster">
      <!-- Loading spinner (shown until fetch completes) -->
      <div id="loading">
        <div class="spinner"></div>
        Fetching heroes…
      </div>
      <!-- Error message (shown if the API call fails) -->
      <div id="error-msg">
        Could not load heroes. Check your connection and refresh.
      </div>
    </section>

    <!-- ── SCALING GRAPH ───────────────────────────────────────────────── -->
    <section id="scaling-section" aria-label="Hero scaling graph">
      <div class="scaling-toolbar">
        <div class="stat-tabs" role="tablist" aria-label="Stat to display">
          <button class="stat-tab active" data-stat="health" role="tab">Health</button>
          <button class="stat-tab" data-stat="weapon" role="tab">Weapon</button>
          <button class="stat-tab" data-stat="spirit" role="tab">Spirit</button>
        </div>
        <button class="toggle-all-btn" id="toggle-all-btn">Hide All</button>
      </div>
      <div class="chart-wrap">
        <canvas id="scaling-chart"></canvas>
      </div>
      <div id="chart-legend" aria-label="Hero toggles"></div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════
       FOOTER
  ════════════════════════════════════════════════════════════════════════ -->
  <footer>
    Data from <a href="https://deadlock-api.com" target="_blank" rel="noopener noreferrer">deadlock-api.com</a>
    &nbsp;·&nbsp;
    Not affiliated with Valve Corporation
  </footer>

  <!-- ═══════════════════════════════════════════════════════════════════════
       MODAL — hero detail panel (hidden until a card is clicked)

       role="dialog" + aria-modal="true" tells screen readers this is a
       modal dialog that traps focus.
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-hero-name">
    <div id="modal">

      <button id="modal-close" aria-label="Close hero detail">✕</button>

      <!-- Wide banner image across the top -->
      <img id="modal-banner" src="" alt="">

      <div id="modal-body">
        <h2 id="modal-hero-name"></h2>
        <p class="modal-meta" id="modal-meta"></p>
        <p class="lore-text" id="modal-lore"></p>

        <p class="modal-section-label">Base Stats</p>
        <!--
          <dl> = description list — the semantic HTML for key/value pairs.
          Each pair is wrapped in a <div> for grid layout, with
          <dt> (term) and <dd> (definition/value) inside.
        -->
        <dl class="stats" id="modal-stats"></dl>

        <p class="modal-section-label">Tags</p>
        <div class="tags" id="modal-tags"></div>
      </div>

    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════════════════════
       JAVASCRIPT
       Placed at the bottom of <body> so the HTML above is parsed first.
  ════════════════════════════════════════════════════════════════════════ -->
  <script>
    // ── 1. Grab references to the DOM elements we'll need ──────────────────
    const grid          = document.getElementById('hero-grid');
    const loadingEl     = document.getElementById('loading');
    const errorEl       = document.getElementById('error-msg');
    const searchInput   = document.getElementById('search');
    const roleSelect    = document.getElementById('filter-role');
    const complexSelect = document.getElementById('filter-complexity');
    const resultCount   = document.getElementById('result-count');
    const modalOverlay  = document.getElementById('modal-overlay');
    const modalClose    = document.getElementById('modal-close');

    // ── 2. Application state ───────────────────────────────────────────────
    let allHeroes = [];   // full list fetched from API
    let displayed = [];   // list after current filters are applied

    // ── 3. Fetch heroes ────────────────────────────────────────────────────
    //
    // async/await lets us write asynchronous code that reads like sync code.
    // fetch() returns a Promise — it resolves when the response arrives.
    //
    async function fetchHeroes() {
      try {
        const response = await fetch('https://assets.deadlock-api.com/v2/heroes');

        // response.ok is true for HTTP 200–299 status codes
        if (!response.ok) {
          throw new Error(`API returned status ${response.status}`);
        }

        // response.json() parses the JSON body — also a Promise
        const heroes = await response.json();

        // Keep only heroes that are actually playable
        allHeroes = heroes.filter(h =>
          h.player_selectable && !h.disabled && !h.in_development
        );

        buildRoleFilter();
        applyFilters();
        loadingEl.style.display = 'none';

      } catch (err) {
        // Something went wrong — show the error message
        console.error(err);
        loadingEl.style.display = 'none';
        errorEl.style.display   = 'block';
      }
    }

    // ── 4. Populate the role <select> from actual API data ─────────────────
    function buildRoleFilter() {
      // Set collects unique values; spread [...] converts it back to an array
      const roles = [...new Set(
        allHeroes.map(h => h.hero_type).filter(Boolean)
      )].sort();

      roles.forEach(role => {
        const opt = document.createElement('option');
        opt.value       = role;
        opt.textContent = role;
        roleSelect.appendChild(opt);
      });
    }

    // ── 5. Filter the hero list based on current control values ───────────
    function applyFilters() {
      const query      = searchInput.value.trim().toLowerCase();
      const role       = roleSelect.value;
      const complexity = Number(complexSelect.value) || 0;

      displayed = allHeroes.filter(hero => {
        const nameMatch = !query      || hero.name.toLowerCase().includes(query);
        const roleMatch = !role       || hero.hero_type === role;
        const compMatch = !complexity || hero.complexity === complexity;
        return nameMatch && roleMatch && compMatch;
      });

      renderGrid();
    }

    // ── 6. Render hero cards into the grid ─────────────────────────────────
    function renderGrid() {
      // Remove old cards (keep the loading/error divs by targeting only articles)
      grid.querySelectorAll('article').forEach(el => el.remove());

      resultCount.textContent =
        `${displayed.length} hero${displayed.length !== 1 ? 'es' : ''}`;

      if (displayed.length === 0 && allHeroes.length > 0) {
        // Show a friendly empty state
        const empty = document.createElement('p');
        empty.id = 'empty-msg';
        empty.style.cssText = 'grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted)';
        empty.textContent = 'No heroes match your filters.';
        grid.appendChild(empty);
        return;
      }

      // Remove any previous empty-state message
      document.getElementById('empty-msg')?.remove();

      displayed.forEach(hero => {
        // <article> is the semantic element for a self-contained card
        const card = document.createElement('article');
        card.className = 'hero-card';
        card.setAttribute('tabindex', '0');          // makes it keyboard-focusable
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `View ${hero.name} details`);

        // Complexity dots: up to 3, filled based on hero.complexity (1–3)
        const dots = [1, 2, 3]
          .map(n => `<span class="dot ${n <= (hero.complexity || 1) ? 'filled' : ''}"></span>`)
          .join('');

        // Pick the best available image
        const img = hero.images?.icon_hero_card_webp
                 || hero.images?.icon_hero_card
                 || '';

        // innerHTML sets the card's inner HTML from a template literal string
        card.innerHTML = `
          <img src="${img}" alt="${hero.name}" loading="lazy">
          <div class="card-info">
            <h3>${hero.name}</h3>
            <p class="role-label">${hero.hero_type || ''}</p>
            <div class="complexity-dots" aria-label="Complexity: ${hero.complexity || 1} of 3">
              ${dots}
            </div>
          </div>
        `;

        // Click opens the detail modal
        card.addEventListener('click', () => openModal(hero));

        // Keyboard: Enter or Space also opens it (matches <button> behaviour)
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openModal(hero);
          }
        });

        grid.appendChild(card);
      });
    }

    // ── 7. Open the detail modal for a given hero ──────────────────────────
    function openModal(hero) {
      const s = hero.starting_stats || {};

      // Banner — prefer wide background image, fall back to portrait card
      const banner = document.getElementById('modal-banner');
      banner.src = hero.images?.background_image_webp
                || hero.images?.background_image
                || hero.images?.icon_hero_card_webp
                || '';
      banner.alt = hero.name;
      banner.style.display = banner.src ? 'block' : 'none';

      document.getElementById('modal-hero-name').textContent = hero.name;
      document.getElementById('modal-meta').textContent =
        [hero.hero_type, hero.gun_tag].filter(Boolean).join('  ·  ');
      document.getElementById('modal-lore').textContent =
        hero.description?.lore || hero.description?.playstyle || '';

      // ── Stats (description list) ──────────────────────────────────────
      const statMap = [
        ['Health',        s.max_health],
        ['Move Speed',    s.max_move_speed],
        ['Sprint Speed',  s.sprint_speed],
        ['Stamina',       s.stamina],
        ['Health Regen',  s.base_health_regen],
        ['Light Melee',   s.light_melee_damage],
        ['Heavy Melee',   s.heavy_melee_damage],
        ['Weapon Power',  s.weapon_power],
        ['Tech Duration', s.tech_duration],
        ['Tech Range',    s.tech_range],
      ];

      document.getElementById('modal-stats').innerHTML = statMap
        .filter(([, v]) => v != null)
        .map(([label, v]) => `
          <div>
            <dt>${label}</dt>
            <dd>${typeof v === 'number' ? v.toFixed(v % 1 === 0 ? 0 : 1) : v}</dd>
          </div>
        `).join('');

      // ── Tags ──────────────────────────────────────────────────────────
      document.getElementById('modal-tags').innerHTML =
        (hero.tags || [])
          .map(t => `<span class="tag">${t}</span>`)
          .join('') || '<span style="color:var(--muted);font-size:.8rem">No tags</span>';

      // Show the overlay
      modalOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';   // prevent background scroll
      modalClose.focus();                         // move focus into modal
    }

    // ── 8. Close the modal ─────────────────────────────────────────────────
    function closeModal() {
      modalOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);

    // Clicking the dark overlay (outside the modal box) also closes it
    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) closeModal();
    });

    // Escape key closes the modal
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
    });

    // ── 9. Wire up the filter controls ────────────────────────────────────
    // 'input' fires on every keystroke; 'change' fires when selection changes
    searchInput.addEventListener('input', applyFilters);
    roleSelect.addEventListener('change', applyFilters);
    complexSelect.addEventListener('change', applyFilters);

    // ── 10. Start the app ─────────────────────────────────────────────────
    fetchHeroes();

    // ════════════════════════════════════════════════════════════════════════
    //  SCALING GRAPH
    // ════════════════════════════════════════════════════════════════════════

    const STAT_CONFIG = {
      health: {
        key:   'MODIFIER_VALUE_BASE_HEALTH_FROM_LEVEL',
        label: 'Health Gained per Boon (cumulative)',
        unit:  'HP'
      },
      weapon: {
        key:   'MODIFIER_VALUE_BASE_BULLET_DAMAGE_FROM_LEVEL',
        label: 'Weapon Damage Scaling per Boon (cumulative)',
        unit:  ''
      },
      spirit: {
        key:   'MODIFIER_VALUE_TECH_POWER',
        label: 'Spirit Power per Boon (cumulative)',
        unit:  'SP'
      }
    };

    const MAX_LEVEL  = 36;
    let   activeStat = 'health';
    const hiddenHeroes = new Set();       // stores hero ids that are toggled off
    let   allVisible   = true;

    // Assign each hero a stable color via the golden-angle hue distribution
    function heroColor(index) {
      const hue = Math.round((index * 137.508) % 360);
      return `hsl(${hue}, 72%, 62%)`;
    }

    // Cumulative stat bonus at a given level (0-based origin)
    function valueAtLevel(hero, key, level) {
      return (hero.standard_level_up_upgrades?.[key] ?? 0) * level;
    }

    // ── Draw the chart ────────────────────────────────────────────────────
    function renderChart() {
      if (!allHeroes.length) return;

      const canvas = document.getElementById('scaling-chart');
      const cfg    = STAT_CONFIG[activeStat];
      const dpr    = window.devicePixelRatio || 1;

      // Match CSS size → physical pixels
      const cssW = canvas.clientWidth  || 800;
      const cssH = canvas.clientHeight || 420;
      canvas.width  = cssW * dpr;
      canvas.height = cssH * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const PAD  = { top: 24, right: 24, bottom: 48, left: 72 };
      const cW   = cssW - PAD.left - PAD.right;
      const cH   = cssH - PAD.top  - PAD.bottom;

      ctx.clearRect(0, 0, cssW, cssH);

      // Max y value across all heroes at max level
      const maxVal = Math.max(
        1,
        ...allHeroes.map(h => valueAtLevel(h, cfg.key, MAX_LEVEL))
      );

      // ── Grid lines + Y-axis labels ──────────────────────────────────────
      const GRID_LINES = 5;
      ctx.font        = `11px 'Segoe UI', system-ui, sans-serif`;
      ctx.textBaseline = 'middle';

      for (let i = 0; i <= GRID_LINES; i++) {
        const yCss = PAD.top + cH - (i / GRID_LINES) * cH;
        const val  = maxVal * i / GRID_LINES;

        ctx.strokeStyle = '#2a3040';
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(PAD.left, yCss);
        ctx.lineTo(PAD.left + cW, yCss);
        ctx.stroke();

        ctx.fillStyle  = '#7a8799';
        ctx.textAlign  = 'right';
        const label = val >= 1000 ? (val / 1000).toFixed(1) + 'k' : val.toFixed(val < 10 ? 2 : 0);
        ctx.fillText(label, PAD.left - 8, yCss);
      }

      // ── X-axis labels (every 6 levels) ──────────────────────────────────
      ctx.fillStyle    = '#7a8799';
      ctx.textBaseline = 'top';
      ctx.textAlign    = 'center';
      for (let l = 6; l <= MAX_LEVEL; l += 6) {
        const x = PAD.left + (l / MAX_LEVEL) * cW;
        ctx.fillText(l, x, PAD.top + cH + 10);
      }

      // ── Axis label: X ───────────────────────────────────────────────────
      ctx.fillStyle = '#7a8799';
      ctx.textAlign = 'center';
      ctx.font      = `12px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillText('Boon Level', PAD.left + cW / 2, PAD.top + cH + 30);

      // ── Axis label: Y ───────────────────────────────────────────────────
      ctx.save();
      ctx.translate(14, PAD.top + cH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(cfg.label, 0, 0);
      ctx.restore();

      // ── Hero lines ──────────────────────────────────────────────────────
      allHeroes.forEach((hero, i) => {
        if (hiddenHeroes.has(hero.id)) return;

        const color = heroColor(i);
        ctx.strokeStyle = color;
        ctx.lineWidth   = 2;
        ctx.lineJoin    = 'round';
        ctx.beginPath();

        for (let l = 0; l <= MAX_LEVEL; l++) {
          const val = valueAtLevel(hero, cfg.key, l);
          const x   = PAD.left + (l / MAX_LEVEL) * cW;
          const y   = PAD.top  + cH - (val / maxVal) * cH;
          l === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      });
    }

    // ── Render the clickable hero legend ──────────────────────────────────
    function renderLegend() {
      const legend = document.getElementById('chart-legend');
      legend.innerHTML = '';

      allHeroes.forEach((hero, i) => {
        const item   = document.createElement('button');
        item.className = 'legend-item' + (hiddenHeroes.has(hero.id) ? ' hidden' : '');
        item.setAttribute('aria-pressed', !hiddenHeroes.has(hero.id));
        item.setAttribute('title', hero.name);

        const swatch = document.createElement('span');
        swatch.className = 'legend-swatch';
        swatch.style.background = heroColor(i);

        const name = document.createElement('span');
        name.textContent = hero.name;

        item.appendChild(swatch);
        item.appendChild(name);

        item.addEventListener('click', () => {
          if (hiddenHeroes.has(hero.id)) {
            hiddenHeroes.delete(hero.id);
          } else {
            hiddenHeroes.add(hero.id);
          }
          // Keep allVisible in sync
          allVisible = hiddenHeroes.size === 0;
          document.getElementById('toggle-all-btn').textContent =
            allVisible ? 'Hide All' : 'Show All';
          item.classList.toggle('hidden');
          item.setAttribute('aria-pressed', !hiddenHeroes.has(hero.id));
          renderChart();
        });

        legend.appendChild(item);
      });
    }

    // ── Toggle-all button ─────────────────────────────────────────────────
    document.getElementById('toggle-all-btn').addEventListener('click', () => {
      if (allVisible) {
        allHeroes.forEach(h => hiddenHeroes.add(h.id));
        allVisible = false;
        document.getElementById('toggle-all-btn').textContent = 'Show All';
      } else {
        hiddenHeroes.clear();
        allVisible = true;
        document.getElementById('toggle-all-btn').textContent = 'Hide All';
      }
      renderLegend();
      renderChart();
    });

    // ── Stat tab switching ────────────────────────────────────────────────
    document.querySelectorAll('.stat-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.stat-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeStat = btn.dataset.stat;
        renderChart();
      });
    });

    // ── View tab switching (Browser ↔ Scaling Graph) ──────────────────────
    const browserSection  = document.getElementById('hero-grid').closest('section') || document.querySelector('main');
    const scalingSection  = document.getElementById('scaling-section');
    const statusBar       = document.querySelector('.status-bar');
    const controlsEl      = document.querySelector('.controls');

    document.getElementById('tab-browser').addEventListener('click', () => {
      document.getElementById('tab-browser').classList.add('active');
      document.getElementById('tab-scaling').classList.remove('active');
      scalingSection.style.display = 'none';
      document.getElementById('hero-grid').style.display = '';
      statusBar.style.display = '';
      controlsEl.style.display = '';
    });

    document.getElementById('tab-scaling').addEventListener('click', () => {
      document.getElementById('tab-scaling').classList.add('active');
      document.getElementById('tab-browser').classList.remove('active');
      document.getElementById('hero-grid').style.display = 'none';
      statusBar.style.display = 'none';
      controlsEl.style.display = 'none';
      scalingSection.style.display = 'block';
      renderLegend();
      renderChart();
    });

    // Redraw on resize
    window.addEventListener('resize', () => {
      if (scalingSection.style.display !== 'none') renderChart();
    });
  </script>

</body>
</html>
